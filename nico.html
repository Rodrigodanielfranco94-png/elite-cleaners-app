<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico Assistant PRO</title>

<style>
body {
  background: #000;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  text-align: center;
  padding: 20px;
}

#nico {
  width: 280px;
  margin-top: 20px;
}

#chat {
  margin: 20px auto;
  background: #1c1c1e;
  padding: 15px;
  border-radius: 20px;
  max-width: 350px;
}

input {
  width: 65%;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #3b82f6;
  color: white;
  font-weight: bold;
}

.quick-buttons button {
  margin: 5px;
  background: #111;
  border: 1px solid #3b82f6;
}
</style>
</head>

<body>

<h2>Nico - Assistant</h2>

<img id="nico" src="nico-assets/reposo.png">

<div id="chat">Hola Rodri 👋</div>

<br>

<input id="mensaje" placeholder="Escríbele a Nico...">
<button onclick="enviarMensaje()">Enviar</button>

<div class="quick-buttons">
  <button onclick="respuestaRapida('hola')">Saludar</button>
  <button onclick="respuestaRapida('trabajo')">Trabajo</button>
  <button onclick="respuestaRapida('animo')">Ánimo</button>
  <button onclick="respuestaRapida('musica')">Música</button>
</div>

<script>

const VOZ_URL = "https://us-central1-elite-cleaners-app.cloudfunctions.net/vozNico";
const IA_URL = "https://us-central1-elite-cleaners-app.cloudfunctions.net/pensarNico";

const chat = document.getElementById("chat");
const input = document.getElementById("mensaje");

// 🔊 VOZ
async function hablar(texto){
  try{
    const res = await fetch(VOZ_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json"},
      body: JSON.stringify({ texto })
    });

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    chat.innerHTML += `
      <br>
      <audio controls autoplay style="width:100%">
        <source src="${url}" type="audio/mpeg">
      </audio>
    `;

  }catch(e){
    console.log("Error voz:", e);
  }
}

// 🧠 IA (OpenAI)
async function pensar(mensaje){

  const res = await fetch(IA_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json"},
    body: JSON.stringify({ mensaje })
  });

  const data = await res.json();
  return data.respuesta;
}

// 💬 ENVÍO
async function enviarMensaje(){

  const msg = input.value.trim();
  if(!msg) return;

  chat.innerHTML = "Nico está pensando...";

  try{
    const respuesta = await pensar(msg);

    chat.innerHTML = respuesta;

    hablar(respuesta);

  }catch(e){
    chat.innerHTML = "Error hablando con Nico";
  }

  input.value = "";
}

// ⚡ BOTONES RÁPIDOS
function respuestaRapida(tipo){

  let texto = "";

  if(tipo==="hola") texto = "Hola Nico";
  if(tipo==="trabajo") texto = "Ayúdame a organizar el trabajo";
  if(tipo==="animo") texto = "Necesito ánimo";
  if(tipo==="musica") texto = "Hablemos de música";

  input.value = texto;
  enviarMensaje();
}

// ENTER
input.addEventListener("keydown", e=>{
  if(e.key==="Enter") enviarMensaje();
});

</script>

</body>
</html>
