<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico 🔥 Animado</title>

<style>
body{
  background:black;
  color:white;
  font-family:Arial;
  text-align:center;
}

#avatar{
  width:180px;
  height:300px;
  margin-top:40px;
  transition:0.3s;
}

button{
  margin-top:20px;
  padding:15px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:white;
}

#estado{
  margin-top:20px;
  font-size:18px;
}
</style>
</head>

<body>

<h1>Nico 🔥 Animado</h1>

<img id="avatar" src="nico-assets/reposo.png">

<div id="estado">Nico en reposo...</div>

<button onclick="caminar()">🚶 Caminar</button>
<button onclick="detener()">🛑 Detener</button>

<script>

const avatar = document.getElementById("avatar");
const estado = document.getElementById("estado");

let caminando = false;
let intervalo;

// CONFIG SPRITE
const totalFrames = 6;
let frame = 0;

function caminar(){

  if(caminando) return;

  caminando = true;
  estado.innerText = "Nico caminando...";

  avatar.src = "nico-assets/camina-sprite.PNG";

  avatar.style.objectFit = "none";

  const frameWidth = 180;

  intervalo = setInterval(() => {

    frame = (frame + 1) % totalFrames;

    avatar.style.objectPosition = `-${frame * frameWidth}px 0px`;

  }, 120);
}

function detener(){

  caminando = false;
  clearInterval(intervalo);

  avatar.src = "nico-assets/reposo.png";
  avatar.style.objectFit = "contain";

  estado.innerText = "Nico en reposo...";
}

</script>
  
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 3;

const renderer = new THREE.WebGLRenderer({ alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);

document.body.appendChild(renderer.domElement);

const light = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
scene.add(light);

const loader = new GLTFLoader();

loader.load(
  './assets/3d/Meshy_AI_Thumbs_Up_Teen_0520063851_texture.glb',
  function (gltf) {

    const model = gltf.scene;

    model.scale.set(1.5, 1.5, 1.5);

    model.position.y = -1.5;

    scene.add(model);

    animate();

    function animate() {
      requestAnimationFrame(animate);

      model.rotation.y += 0.003;

      renderer.render(scene, camera);
    }

  },
  undefined,
  function (error) {
    console.error(error);
  }
);
</script>
  
</body>
</html>
