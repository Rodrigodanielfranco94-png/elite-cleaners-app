<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico Realtime</title>

<style>
body {
    background: #000;
    color: white;
    font-family: -apple-system, sans-serif;
    text-align: center;
    padding: 20px;
}

.avatar {
    width: 260px;
    margin-top: 30px;
    transition: 0.3s;
}

.hablando {
    transform: scale(1.05);
    filter: brightness(1.2);
}

.card {
    background: #1c1c1e;
    padding: 15px;
    border-radius: 15px;
    margin-top: 20px;
}

button {
    background: #22c55e;
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-weight: bold;
    margin-top: 20px;
    color: white;
    width: 90%;
}

</style>
</head>

<body>

<h1>Nico 🔥 Realtime</h1>

<img id="nicoAvatar" class="avatar" src="https://i.imgur.com/8Km9tLL.png">

<div class="card" id="textoNico">
    Tocá activar y hablá conmigo, bro…
</div>

<button onclick="startNico()">🔥 Activar Nico</button>

<script>
let pc;
let dc;
let audioElement;
let isTalking = false;

async function startNico() {

    try {

        // 🔑 1. Token desde tu backend
        const tokenRes = await fetch("https://us-central1-elite-cleaners-app.cloudfunctions.net/crearSesionRealtime");
        const data = await tokenRes.json();

        const EPHEMERAL_KEY = data.client_secret.value;

        // 🔊 2. Audio output
        audioElement = document.createElement("audio");
        audioElement.autoplay = true;

        // 🔗 3. WebRTC
        pc = new RTCPeerConnection();

        pc.ontrack = e => {
            audioElement.srcObject = e.streams[0];

            // animación cuando habla
            hablarAnimacion();
        };

        // 🎤 4. Micrófono
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        stream.getTracks().forEach(track => {
            pc.addTrack(track, stream);
        });

        // 📡 5. Data channel
        dc = pc.createDataChannel("oai-events");

        dc.onmessage = (event) => {
            console.log("Evento:", event.data);

            try {
                const msg = JSON.parse(event.data);

                if (msg.type === "response.output_text.delta") {
                    document.getElementById("textoNico").innerText += msg.delta;
                }

                if (msg.type === "response.completed") {
                    pararAnimacion();
                }

            } catch {}
        };

        // 🧠 6. Oferta
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // 🌐 7. Enviar a OpenAI
        const baseUrl = "https://api.openai.com/v1/realtime";
        const model = "gpt-realtime";

        const sdpResponse = await fetch(`${baseUrl}?model=${model}`, {
            method: "POST",
            body: offer.sdp,
            headers: {
                Authorization: `Bearer ${EPHEMERAL_KEY}`,
                "Content-Type": "application/sdp"
            }
        });

        const answer = {
            type: "answer",
            sdp: await sdpResponse.text()
        };

        await pc.setRemoteDescription(answer);

        console.log("🔥 Nico REALTIME ACTIVADO");

        document.getElementById("textoNico").innerText = "Ey Rodri… te escucho 👂";

    } catch (err) {
        console.error(err);
        alert("Error activando Nico 😢");
    }
}


// 🔥 Animaciones

function hablarAnimacion() {
    if (!isTalking) {
        isTalking = true;
        document.getElementById("nicoAvatar").classList.add("hablando");
    }
}

function pararAnimacion() {
    isTalking = false;
    document.getElementById("nicoAvatar").classList.remove("hablando");
}

</script>

</body>
</html>
