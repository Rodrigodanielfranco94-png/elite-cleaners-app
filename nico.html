<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico Vivo</title>

<style>
body{
  background:#000;
  color:white;
  font-family:-apple-system;
  text-align:center;
  margin:0;
}

#textoNico{
  position:fixed;
  top:20px;
  width:100%;
  text-align:center;
  font-size:18px;
}

/* Nico flotante */
#nico-container{
  position:fixed;
  bottom:30px;
  left:0;
  width:180px;
  transition:left 6s linear;
  z-index:999;
}

#nico-avatar{
  width:100%;
  animation:pasos 0.6s infinite alternate ease-in-out;
}

@keyframes pasos{
  0%{transform:translateY(0px) rotate(-1deg);}
  100%{transform:translateY(-6px) rotate(1deg);}
}

.parado{
  animation:none !important;
}

</style>
</head>

<body>

<div id="textoNico">Rodri... estoy contigo 👀</div>

<div id="nico-container">
  <img id="nico-avatar" src="nico-assets/reposo.png">
</div>

<script>

const BACKEND = "https://us-central1-elite-cleaners-app.cloudfunctions.net/crearSesionRealtime";

let pc, dc, audioEl;
let caminando = true;
let direccion = 1;

const nico = document.getElementById("nico-container");
const avatar = document.getElementById("nico-avatar");
const texto = document.getElementById("textoNico");

// ============================
// 🧠 MOVIMIENTO AUTOMÁTICO
// ============================

function moverNico(){
  if(!caminando) return;

  let max = window.innerWidth - 180;

  if(direccion === 1){
    nico.style.left = max + "px";
    avatar.style.transform = "scaleX(1)";
  }else{
    nico.style.left = "0px";
    avatar.style.transform = "scaleX(-1)";
  }

  avatar.src = "nico-assets/camina.png";

  direccion *= -1;
}

setInterval(moverNico, 6000);
moverNico();

// ============================
// 🎭 ESTADOS DE NICO
// ============================

function estadoReposo(){
  avatar.src = "nico-assets/reposo.png";
  avatar.classList.remove("parado");
  caminando = true;
}

function estadoEscucha(){
  avatar.src = "nico-assets/saluda.png";
  avatar.classList.add("parado");
  caminando = false;
}

function estadoPensando(){
  avatar.src = "nico-assets/piensa.png";
}

function estadoHablando(){
  avatar.src = "nico-assets/alegre.png";
}

// ============================
// 🎤 ACTIVAR NICO (TOCAR)
// ============================

nico.onclick = () => {
  iniciarRealtime();
};

// ============================
// 🔥 WEBRTC
// ============================

async function iniciarRealtime(){

  try{

    estadoEscucha();
    texto.innerText = "Te escucho bro...";

    const r = await fetch(BACKEND);
    const data = await r.json();

    const KEY = data.client_secret?.value || data.value;

    pc = new RTCPeerConnection();

    audioEl = document.createElement("audio");
    audioEl.autoplay = true;

    pc.ontrack = e=>{
      audioEl.srcObject = e.streams[0];
      audioEl.play().catch(()=>{});
      estadoHablando();
    };

    const mic = await navigator.mediaDevices.getUserMedia({audio:true});
    mic.getTracks().forEach(t=>pc.addTrack(t,mic));

    dc = pc.createDataChannel("oai");

    dc.onmessage = e=>{
      try{
        const msg = JSON.parse(e.data);

        if(msg.type==="input_audio_buffer.speech_started"){
          estadoEscucha();
          texto.innerText = "Te escucho...";
        }

        if(msg.type==="input_audio_buffer.speech_stopped"){
          estadoPensando();
          texto.innerText = "Pensando...";
        }

        if(msg.type==="response.audio_transcript.delta"){
          texto.innerText = msg.delta || "...";
        }

        if(msg.type==="response.done"){
          setTimeout(()=>{
            estadoReposo();
            texto.innerText = "Aquí estoy contigo bro 👊";
          },1500);
        }

      }catch{}
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const sdp = await fetch("https://api.openai.com/v1/realtime/calls",{
      method:"POST",
      body:offer.sdp,
      headers:{
        Authorization:`Bearer ${KEY}`,
        "Content-Type":"application/sdp"
      }
    });

    const answer = {
      type:"answer",
      sdp:await sdp.text()
    };

    await pc.setRemoteDescription(answer);

  }catch(err){
    console.error(err);
    texto.innerText = "No pude activarme bro 😕";
    estadoReposo();
  }
}

</script>

</body>
</html>
