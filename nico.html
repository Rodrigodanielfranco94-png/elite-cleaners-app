<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico Emociones</title>

<style>
body{
  background:#000;
  color:white;
  font-family:-apple-system;
  text-align:center;
  padding:20px;
}

#nico{
  width:280px;
  transition:0.3s;
}

#chat{
  background:#1c1c1e;
  padding:15px;
  border-radius:20px;
  margin-top:20px;
}

input{
  width:65%;
  padding:12px;
  border-radius:10px;
  border:none;
}

button{
  padding:12px;
  border-radius:10px;
  border:none;
  background:#3b82f6;
  color:white;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.mic{background:#16a34a;}
.hidden{display:none;}
</style>
</head>

<body>

<h2>Nico - HUMANO</h2>

<img id="nico" src="nico-assets/reposo.png">

<div id="chat">Ey Rodri 👋</div>

<br>

<input id="mensaje" placeholder="Escríbele a Nico...">
<button onclick="enviarMensaje()">Enviar</button>

<div class="grid">
  <button class="mic" onclick="activarMicrofono()">🎙️ Hablar</button>
  <button onclick="quick('animo')">Ánimo</button>
  <button onclick="quick('hoy')">Hoy</button>
  <button onclick="quick('mañana')">Mañana</button>
  <button onclick="quick('trabajo')">Trabajo</button>
  <button onclick="quick('musica')">Música</button>
</div>

<button id="btnAudio" class="hidden">🔊 Escuchar</button>

<script>

const VOZ_URL = "https://voznico-cnnxm2vdja-uc.a.run.app";
const IA_URL  = "https://pensarnico-cnnxm2vdja-uc.a.run.app";

let audioActual = null;
let audioHabilitado = false;

const chat = document.getElementById("chat");
const nico = document.getElementById("nico");
const btnAudio = document.getElementById("btnAudio");

// ================= EMOCIONES =================
function detectarEmocion(texto){
  const t = texto.toLowerCase();

  if(t.includes("cansado")||t.includes("triste")||t.includes("mal")) return "triste";
  if(t.includes("feliz")||t.includes("bien")) return "feliz";
  if(t.includes("trabajo")||t.includes("cliente")) return "trabajo";
  if(t.includes("musica")||t.includes("cantar")) return "musica";
  if(t.includes("hola")) return "saludo";

  return "neutral";
}

function cambiarCara(texto){
  const e = detectarEmocion(texto);

  if(e==="triste") nico.src="nico-assets/reposo.png";
  else if(e==="feliz") nico.src="nico-assets/alegre.png";
  else if(e==="trabajo") nico.src="nico-assets/celular.png";
  else if(e==="musica") nico.src="nico-assets/canta.png";
  else if(e==="saludo") nico.src="nico-assets/saluda.png";
  else nico.src="nico-assets/alegre.png";
}

// ================= VOZ =================
async function hablar(texto){

  const res = await fetch(VOZ_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json"},
    body: JSON.stringify({ texto })
  });

  const blob = await res.blob();
  const url = URL.createObjectURL(blob);

  if(audioActual){
    audioActual.pause();
    audioActual.currentTime=0;
  }

  audioActual = new Audio(url);

  window.playAudio = async ()=>{
    try{
      audioHabilitado=true;
      await audioActual.play();
    }catch(e){}
  };

  if(audioHabilitado){
    try{
      await window.playAudio();
    }catch{
      btnAudio.classList.remove("hidden");
    }
  }else{
    btnAudio.classList.remove("hidden");
  }
}

btnAudio.onclick=()=>{ if(audioActual) window.playAudio(); };

// ================= IA =================
async function pensar(msg){

  chat.innerHTML="Pensando...";
  nico.src="nico-assets/piensa.png";

  const res = await fetch(IA_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json"},
    body: JSON.stringify({ mensaje: msg })
  });

  const data = await res.json();

  chat.innerHTML=data.respuesta;

  cambiarCara(msg+" "+data.respuesta);
  hablar(data.respuesta);
}

// ================= INPUT =================
function enviarMensaje(){
  const msg=document.getElementById("mensaje").value;
  if(!msg) return;

  pensar(msg);
  document.getElementById("mensaje").value="";
}

// ================= BOTONES =================
function quick(tipo){

  if(tipo==="animo") pensar("Nico estoy cansado bro");
  if(tipo==="trabajo") pensar("Nico organiza mi trabajo");
  if(tipo==="musica") pensar("Nico hablemos de musica");
  if(tipo==="hoy") pensar("Nico que tengo hoy?");
  if(tipo==="mañana") pensar("Nico que tengo mañana?");
}

// ================= MIC =================
function activarMicrofono(){

  audioHabilitado=true;

  const rec = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.lang="es-ES";

  rec.start();

  rec.onresult=(e)=>{
    const texto=e.results[0][0].transcript;
    chat.innerHTML="Tú: "+texto;

    setTimeout(()=>{
      pensar(texto);
    },200);
  };

  rec.onerror=()=> chat.innerHTML="No te escuché bien bro.";
}

document.getElementById("mensaje").addEventListener("keydown",e=>{
  if(e.key==="Enter") enviarMensaje();
});

</script>

</body>
</html>
