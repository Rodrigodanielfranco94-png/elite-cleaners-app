<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nico Assistant</title>
  <style>
    body {
      background: #000;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    #nico {
      width: 250px;
      transition: 0.3s;
    }

    button {
      padding: 15px;
      border-radius: 10px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
    }

    #chat {
      margin-top: 20px;
      background: #1c1c1e;
      padding: 15px;
      border-radius: 15px;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
      display: none;
      font-size: 15px;
    }
  </style>
</head>
<body>

<h2>Nico - Assistant</h2>

<img id="nico" src="nico-assets/reposo.png">

<br>

<button onclick="hablar()">Hablar con Nico</button>

<div id="chat"></div>

<script>
  const nico = document.getElementById("nico");
  const chat = document.getElementById("chat");

  function hablarConVoz(texto) {
    // Detiene cualquier voz anterior
    window.speechSynthesis.cancel();

    const audio = new SpeechSynthesisUtterance(texto);
    audio.lang = "es-ES";
    audio.pitch = 1;
    audio.rate = 1;

    window.speechSynthesis.speak(audio);
  }

  function hablar() {
    nico.src = "nico-assets/celular.png";
    chat.style.display = "none";

    setTimeout(() => {
      nico.src = "nico-assets/piensa.png";
    }, 1500);

    setTimeout(() => {
      const respuesta = "¿Qué más pues Rodri? 😄 Estoy listo para ayudarte";

      nico.src = "nico-assets/alegre.png";
      chat.style.display = "block";
      chat.innerText = respuesta;

      hablarConVoz(respuesta);
    }, 3000);
  }
</script>

</body>
</html>
