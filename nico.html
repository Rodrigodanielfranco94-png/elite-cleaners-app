<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nico Assistant</title>

  <style>
    body {
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h2 {
      margin-top: 35px;
      font-size: 28px;
      font-weight: 800;
    }

    #nico {
      width: 320px;
      max-width: 90%;
      transition: 0.3s ease;
    }

    #chat {
      margin: 22px auto;
      background: #1c1c1e;
      padding: 18px;
      border-radius: 20px;
      max-width: 370px;
      font-size: 18px;
      display: none;
      line-height: 1.4;
    }

    .input-box {
      max-width: 370px;
      margin: 20px auto;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    .quick-buttons {
      max-width: 370px;
      margin: 18px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quick-buttons button {
      background: #1c1c1e;
      border: 1px solid #3b82f6;
    }

    .small-note {
      color: #8e8e93;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h2>Nico - Assistant</h2>

<img id="nico" src="nico-assets/reposo.png"/>

<div id="chat"></div>

<div class="input-box">
  <input id="mensaje" type="text" placeholder="Escríbele a Nico..." />
  <button id="btnEnviar" onclick="enviarMensaje()">Enviar</button>
</div>

<div class="quick-buttons">
  <button onclick="respuestaRapida('hola')">Saludar</button>
  <button onclick="respuestaRapida('trabajo')">Trabajo</button>
  <button onclick="respuestaRapida('animo')">Ánimo</button>
  <button onclick="respuestaRapida('musica')">Música</button>
</div>

<div class="small-note">Nico con voz real + IA 🔥</div>

<script>
const VOZ_NICO_URL = "https://us-central1-elite-cleaners-app.cloudfunctions.net/vozNico";

const nico = document.getElementById("nico");
const chat = document.getElementById("chat");
const mensajeInput = document.getElementById("mensaje");
const btnEnviar = document.getElementById("btnEnviar");

let audioActual = null;
let audioHabilitado = false;

// 🔥 DESBLOQUEO REAL DE AUDIO EN iPHONE
function habilitarAudio() {
  if (audioHabilitado) return;

  const audio = new Audio();
  audio.src = "";
  audio.play().then(() => {
    audioHabilitado = true;
    console.log("Audio desbloqueado");
  }).catch(() => {
    console.log("Esperando interacción...");
  });
}

// 👇 IMPORTANTE: activar en primer toque
document.addEventListener("touchstart", habilitarAudio, { once: true });
document.addEventListener("click", habilitarAudio, { once: true });

function limpiarTexto(texto){
  return texto.replace(/[^\p{L}\p{N}\p{P}\p{Z}¿¡áéíóúÁÉÍÓÚñÑ]/gu,"");
}

async function hablar(texto){

  try{
    if(audioActual){
      audioActual.pause();
      audioActual.currentTime = 0;
    }

    const res = await fetch(VOZ_NICO_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json"},
      body: JSON.stringify({ texto })
    });

    if(!res.ok){
      throw new Error("Error backend");
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    audioActual = new Audio(url);
    audioActual.playsInline = true;
    audioActual.muted = false;

    const playPromise = audioActual.play();

    if(playPromise !== undefined){
      playPromise.catch(() => {
        console.log("iPhone bloqueó audio → fallback");
        hablarFallback(texto);
      });
    }

  }catch(e){
    console.log("Error voz:", e);
    hablarFallback(texto);
  }
}

function hablarFallback(texto){
  if (!("speechSynthesis" in window)) return;

  const speech = new SpeechSynthesisUtterance(texto);
  speech.lang="es-US";
  speech.rate=0.9;
  speech.pitch=0.9;

  speechSynthesis.speak(speech);
}

function responder(texto, imagen){
  nico.src="nico-assets/piensa.png";
  chat.style.display="block";
  chat.innerText="Nico está pensando...";

  setTimeout(()=>{
    nico.src=imagen;
    chat.innerText=texto;
    hablar(texto);
  },700);
}

function enviarMensaje(){
  const txt = mensajeInput.value.trim().toLowerCase();
  if(!txt) return;

  mensajeInput.value="";

  let r="Te escucho bro";
  let img="nico-assets/alegre.png";

  if(txt.includes("hola")){
    r="Ey Rodri, aquí estoy contigo bro 🔥";
    img="nico-assets/saluda.png";
  }

  responder(r,img);
}

function respuestaRapida(t){
  if(t==="hola"){
    responder("Ey Rodri 🔥 aquí estoy bro","nico-assets/saluda.png");
  }
}
</script>
</body>
</html>
