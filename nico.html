<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico 🔥 Realtime</title>

<style>
body{
  background:#000;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  text-align:center;
  padding:18px;
  margin:0;
}
h1{margin-top:25px}

.avatar-wrap{
  position:relative;
  width:300px;
  margin:20px auto;
}

#nicoAvatar{
  width:100%;
  animation:respirar 3s infinite;
}

#boca{
  position:absolute;
  top:34%;
  left:50%;
  width:30px;
  height:6px;
  background:#2b0b0b;
  border-radius:50%;
  transform:translateX(-50%);
}

@keyframes respirar{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.02)}
}

.card{
  background:#1c1c1e;
  padding:16px;
  border-radius:20px;
  margin:15px auto;
  max-width:420px;
}

button{
  width:90%;
  padding:15px;
  margin:6px;
  border:none;
  border-radius:15px;
  color:white;
  font-weight:bold;
}

.green{background:#16a34a}
.red{background:#dc2626}
</style>
</head>

<body>

<h1>Nico 🔥 Realtime</h1>

<div class="avatar-wrap">
  <img id="nicoAvatar" src="nico-assets/reposo.png">
  <div id="boca"></div>
</div>

<div class="card" id="textoNico">
  Toca activar y habla conmigo...
</div>

<button class="green" onclick="startNico()">🎙️ Activar Nico</button>
<button class="red" onclick="stopNico()">⛔ Detener</button>

<script>
const URL_BACKEND = "https://us-central1-elite-cleaners-app.cloudfunctions.net/crearSesionRealtime";

let pc, dc, audioEl, analyser, ctx;
let conectado = false;
let texto = "";

const avatar = document.getElementById("nicoAvatar");
const boca = document.getElementById("boca");
const textoNico = document.getElementById("textoNico");

const imgs = {
  reposo:"nico-assets/reposo.png",
  saluda:"nico-assets/saluda.png",
  piensa:"nico-assets/piensa.png",
  alegre:"nico-assets/alegre.png",
  rie:"nico-assets/rie.png"
};

function setImg(tipo){
  avatar.src = imgs[tipo] || imgs.reposo;
}

function detectar(texto){
  let t = texto.toLowerCase();
  if(t.includes("g.g")) return "rie";
  if(t.includes("trabajo")||t.includes("cliente")) return "piensa";
  return "alegre";
}

async function startNico(){
  if(conectado) return;

  try{
    textoNico.innerText = "Conectando...";
    setImg("piensa");

    const r = await fetch(URL_BACKEND);
    const data = await r.json();

    const KEY = data.client_secret?.value || data.value;

    pc = new RTCPeerConnection();

    audioEl = document.createElement("audio");
    audioEl.autoplay = true;

    pc.ontrack = e=>{
      audioEl.srcObject = e.streams[0];
      audioEl.play().catch(()=>{});
      lipSync(e.streams[0]);
    };

    const mic = await navigator.mediaDevices.getUserMedia({audio:true});
    mic.getTracks().forEach(t=>pc.addTrack(t,mic));

    dc = pc.createDataChannel("oai");

    dc.onopen=()=>{
      conectado = true;
      textoNico.innerText = "Te escucho Rodri...";
      setImg("saluda");
    };

    dc.onmessage = e=>{
      let msg = JSON.parse(e.data);

      if(msg.type==="response.audio_transcript.delta"){
        texto += msg.delta;
        textoNico.innerText = texto;
        setImg(detectar(texto));
      }

      if(msg.type==="response.done"){
        texto="";
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const sdp = await fetch("https://api.openai.com/v1/realtime/calls",{
      method:"POST",
      body:offer.sdp,
      headers:{
        Authorization:`Bearer ${KEY}`,
        "Content-Type":"application/sdp"
      }
    });

    const answer = {type:"answer", sdp:await sdp.text()};
    await pc.setRemoteDescription(answer);

  }catch(e){
    console.error(e);
    textoNico.innerText = "Uff... no pude activar a Nico.";
    setImg("reposo");
  }
}

function lipSync(stream){
  ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser();
  src.connect(analyser);

  const data = new Uint8Array(analyser.frequencyBinCount);

  function anim(){
    analyser.getByteFrequencyData(data);
    let vol = data.reduce((a,b)=>a+b)/data.length;

    boca.style.height = Math.max(6, vol/3)+"px";

    requestAnimationFrame(anim);
  }
  anim();
}

function stopNico(){
  conectado=false;
  if(pc) pc.close();
  textoNico.innerText="Nico en pausa";
  setImg("reposo");
}
</script>

</body>
</html>
