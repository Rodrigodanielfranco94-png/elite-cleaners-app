<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico Real</title>

<style>
body{
  background:#000;
  color:white;
  font-family:-apple-system;
  text-align:center;
  padding:20px;
}

.avatar-wrap{
  position:relative;
  width:260px;
  margin:auto;
}

#nicoAvatar{
  width:100%;
  transition:0.3s;
}

#boca{
  position:absolute;
  left:50%;
  top:36%;
  width:28px;
  height:8px;
  background:#2a0a0a;
  border-radius:50%;
  transform:translateX(-50%) scaleY(0.4);
}

.hablando{
  filter:brightness(1.2);
}

.card{
  background:#1c1c1e;
  padding:15px;
  border-radius:15px;
  margin-top:20px;
}

button{
  width:90%;
  padding:15px;
  border:none;
  border-radius:12px;
  margin-top:15px;
  font-weight:bold;
  color:white;
}

.green{background:#22c55e}
.red{background:#ef4444}

</style>
</head>

<body>

<h1>Nico 🔥 Real</h1>

<div class="avatar-wrap">
  <img id="nicoAvatar" src="nico-assets/reposo.png">
  <div id="boca"></div>
</div>

<div class="card" id="textoNico">
  Actíname y habla conmigo bro…
</div>

<button class="green" onclick="startNico()">🔥 Activar Nico</button>
<button class="red" onclick="stopNico()">⛔ Detener</button>

<script>

let pc, audioContext, analyser, animationId;

const avatar = document.getElementById("nicoAvatar");
const boca = document.getElementById("boca");

function cambiarEstado(tipo){
  if(tipo === "hablando") avatar.src = "nico-assets/alegre.png";
  if(tipo === "pensando") avatar.src = "nico-assets/piensa.png";
  if(tipo === "riendo") avatar.src = "nico-assets/rie.png";
  if(tipo === "reposo") avatar.src = "nico-assets/reposo.png";
}

async function startNico(){

  cambiarEstado("pensando");

  const tokenRes = await fetch("https://us-central1-elite-cleaners-app.cloudfunctions.net/crearSesionRealtime");
  const data = await tokenRes.json();

  const key = data.client_secret.value;

  pc = new RTCPeerConnection();

  const audio = document.createElement("audio");
  audio.autoplay = true;

  pc.ontrack = e => {
    audio.srcObject = e.streams[0];
    iniciarLipSync(e.streams[0]);
    cambiarEstado("hablando");
  };

  const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  stream.getTracks().forEach(track => pc.addTrack(track, stream));

  const dc = pc.createDataChannel("oai-events");

  dc.onmessage = e => {
    try{
      const msg = JSON.parse(e.data);

      if(msg.type === "response.audio.delta"){
        cambiarEstado("hablando");
      }

      if(msg.type === "response.done"){
        cambiarEstado("reposo");
        cerrarBoca();
      }

    }catch{}
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const res = await fetch("https://api.openai.com/v1/realtime?model=gpt-realtime", {
    method:"POST",
    body:offer.sdp,
    headers:{
      Authorization:`Bearer ${key}`,
      "Content-Type":"application/sdp"
    }
  });

  const answer = {
    type:"answer",
    sdp:await res.text()
  };

  await pc.setRemoteDescription(answer);
}

function iniciarLipSync(stream){

  audioContext = new AudioContext();
  const source = audioContext.createMediaStreamSource(stream);

  analyser = audioContext.createAnalyser();
  source.connect(analyser);

  const data = new Uint8Array(analyser.frequencyBinCount);

  function animar(){
    analyser.getByteFrequencyData(data);

    let sum = 0;
    for(let i=0;i<data.length;i++) sum += data[i];

    let volumen = sum / data.length;

    let altura = Math.min(30, volumen / 3);

    boca.style.height = altura + "px";
    boca.style.transform = `translateX(-50%) scaleY(${altura/20})`;

    animationId = requestAnimationFrame(animar);
  }

  animar();
}

function cerrarBoca(){
  boca.style.height = "8px";
  boca.style.transform = "translateX(-50%) scaleY(0.4)";
}

function stopNico(){
  if(animationId) cancelAnimationFrame(animationId);
  if(audioContext) audioContext.close();
  if(pc) pc.close();

  cambiarEstado("reposo");
  cerrarBoca();
}

</script>

</body>
</html>
