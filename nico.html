<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nico Dios</title>

<style>
body {
  background: #000;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  text-align: center;
  padding: 16px;
  margin: 0;
}

h2 {
  margin-top: 28px;
  font-size: 34px;
  font-weight: 900;
}

#nico {
  width: 330px;
  max-width: 94%;
  margin-top: 10px;
  transition: 0.25s ease;
}

#chat {
  margin: 18px auto;
  background: #1c1c1e;
  padding: 18px;
  border-radius: 24px;
  max-width: 410px;
  font-size: 18px;
  line-height: 1.45;
}

.input-box {
  max-width: 410px;
  margin: 16px auto;
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 16px;
  border-radius: 16px;
  border: none;
  font-size: 16px;
  outline: none;
}

button {
  padding: 14px;
  border-radius: 16px;
  border: none;
  background: #3b82f6;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.grid {
  max-width: 410px;
  margin: 14px auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.grid button {
  background: #1c1c1e;
  border: 1px solid #3b82f6;
}

.listen-btn {
  margin-top: 12px;
  width: 100%;
  background: #2563eb;
}

.mic-btn {
  background: #16a34a !important;
}

.client-btn {
  background: #9333ea !important;
}

.today-btn {
  background: #0f766e !important;
}

.tomorrow-btn {
  background: #0369a1 !important;
}

.status {
  color: #8e8e93;
  font-size: 13px;
  margin-top: 10px;
}

.note {
  color: #8e8e93;
  font-size: 12px;
  margin-top: 14px;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<h2>Nico - DIOS</h2>

<img id="nico" src="nico-assets/reposo.png" alt="Nico Assistant">

<div id="chat">
  Ey Rodri... aquí estoy contigo.
  <div id="audioBox"></div>
</div>

<div class="input-box">
  <input id="mensaje" placeholder="Escríbele a Nico..." autocomplete="off">
  <button id="btnEnviar" onclick="enviarMensaje()">Enviar</button>
</div>

<div class="grid">
  <button class="mic-btn" onclick="activarMicrofono()">🎙️ Hablar</button>
  <button onclick="respuestaRapida('animo')">Ánimo</button>

  <button class="today-btn" onclick="consultarHoy()">Hoy</button>
  <button class="tomorrow-btn" onclick="consultarManana()">Mañana</button>

  <button onclick="respuestaRapida('trabajo')">Trabajo</button>
  <button onclick="respuestaRapida('musica')">Música</button>

  <button class="client-btn" onclick="guardarClienteRapido()">Guardar cliente</button>
  <button onclick="respuestaRapida('memoria')">Memoria</button>
</div>

<div class="note">Nico Dios: IA + voz + memoria + Admin + micrófono 🔥</div>

<script>
const VOZ_NICO_URL = "https://voznico-cnnxm2vdja-uc.a.run.app";
const PENSAR_NICO_URL = "https://pensarnico-cnnxm2vdja-uc.a.run.app";
const CREAR_CLIENTE_URL = "https://crearcliente-cnnxm2vdja-uc.a.run.app";

const nico = document.getElementById("nico");
const chat = document.getElementById("chat");
const mensajeInput = document.getElementById("mensaje");
const btnEnviar = document.getElementById("btnEnviar");

let audioActual = null;
let ocupado = false;
let audioHabilitado = false;

function limpiarTexto(texto) {
  return texto
    .replace(/[^\p{L}\p{N}\p{P}\p{Z}¿¡áéíóúÁÉÍÓÚñÑ]/gu, "")
    .trim();
}

function bloquear(estado) {
  ocupado = estado;
  btnEnviar.disabled = estado;
  document.querySelectorAll(".grid button").forEach(btn => {
    btn.disabled = estado;
  });
}

function setChat(texto) {
  chat.innerHTML = `
    <div>${texto}</div>
    <div id="audioBox"></div>
  `;
}

function imagenSegunTexto(texto) {
  const t = texto.toLowerCase();

  if (t.includes("trabajo") || t.includes("cliente") || t.includes("limpieza") || t.includes("elite") || t.includes("agenda")) {
    return "nico-assets/celular.png";
  }

  if (t.includes("música") || t.includes("musica") || t.includes("guitarra") || t.includes("cantar")) {
    return "nico-assets/canta.png";
  }

  if (t.includes("triste") || t.includes("cansado") || t.includes("preocupado") || t.includes("difícil")) {
    return "nico-assets/reposo.png";
  }

  if (t.includes("hola") || t.includes("saluda")) {
    return "nico-assets/saluda.png";
  }

  return "nico-assets/alegre.png";
}

async function pensarNico(mensaje) {
  const res = await fetch(PENSAR_NICO_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mensaje })
  });

  if (!res.ok) throw new Error("Error en pensarNico");

  const data = await res.json();
  return data.respuesta || "Rodri... aquí estoy contigo. Cuéntame un poquito más.";
}

async function hablarConVoz(texto) {
  const audioBox = document.getElementById("audioBox");

  try {
    audioBox.innerHTML = `<div class="status">Generando voz de Nico...</div>`;

    const res = await fetch(VOZ_NICO_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto: limpiarTexto(texto) })
    });

    if (!res.ok) throw new Error("Error en vozNico");

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    if (audioActual) {
      audioActual.pause();
      audioActual.currentTime = 0;
    }

    audioActual = new Audio(url);
    audioActual.playsInline = true;
    audioActual.setAttribute("playsinline", "");
    audioActual.setAttribute("webkit-playsinline", "");

    audioActual.onplay = function() {
      nico.src = "nico-assets/alegre.png";
    };

    audioActual.onended = function() {
      nico.src = "nico-assets/reposo.png";
      bloquear(false);
      URL.revokeObjectURL(url);
    };

    audioActual.onerror = function() {
      nico.src = "nico-assets/reposo.png";
      bloquear(false);
    };

    window.playAudioNico = async function() {
      try {
        audioHabilitado = true;
        await audioActual.play();
      } catch (e) {
        console.log("Audio bloqueado:", e);
      }
    };

    audioBox.innerHTML = `
      <button class="listen-btn" onclick="window.playAudioNico()">
        🔊 Escuchar a Nico
      </button>
    `;

    if (audioHabilitado) {
      try {
        await window.playAudioNico();
      } catch (e) {
        console.log("iPhone bloqueó autoplay. Usa el botón.");
      }
    }

  } catch (e) {
    console.log("Error voz:", e);
    if (audioBox) {
      audioBox.innerHTML = `<div class="status">No pude reproducir la voz ahora.</div>`;
    }
    bloquear(false);
  }
}

async function responderConIA(mensaje) {
  if (!mensaje || ocupado) return;

  bloquear(true);
  nico.src = "nico-assets/piensa.png";
  setChat("Nico está pensando...");

  try {
    const respuesta = await pensarNico(mensaje);

    setChat(respuesta);
    nico.src = imagenSegunTexto(mensaje + " " + respuesta);
    hablarConVoz(respuesta);

  } catch (e) {
    console.log("Error IA:", e);
    setChat("Uff... Rodri, tuve un problema pensando. Probemos otra vez.");
    nico.src = "nico-assets/piensa.png";
    bloquear(false);
  }
}

async function enviarMensaje() {
  const msg = mensajeInput.value.trim();
  if (!msg || ocupado) return;

  mensajeInput.value = "";

  if (esMensajeDeCliente(msg)) {
    await guardarClienteDesdeTexto(msg);
    return;
  }

  responderConIA(msg);
}

function respuestaRapida(tipo) {
  if (ocupado) return;

  if (tipo === "animo") {
    responderConIA("Nico, necesito ánimo. Háblame como mi hermano.");
  }

  if (tipo === "trabajo") {
    responderConIA("Nico, ayúdame a organizar Elite Cleaners.");
  }

  if (tipo === "musica") {
    responderConIA("Nico, hablemos de música, guitarra y los domingos con papá.");
  }

  if (tipo === "memoria") {
    responderConIA("Nico, qué recuerdas de lo que hablamos hace un rato?");
  }
}

function consultarHoy() {
  responderConIA("Nico, qué trabajos tenemos hoy?");
}

function consultarManana() {
  responderConIA("Nico, qué trabajos tenemos mañana?");
}

// ==========================
// CLIENTES
// ==========================
function esMensajeDeCliente(texto) {
  const t = texto.toLowerCase();
  return (
    t.includes("guardar cliente") ||
    t.includes("nuevo cliente") ||
    t.includes("cliente:")
  );
}

function extraerDato(texto, etiqueta) {
  const regex = new RegExp(etiqueta + "\\s*:\\s*([^,\\n]+)", "i");
  const match = texto.match(regex);
  return match ? match[1].trim() : "";
}

async function guardarClienteDesdeTexto(texto) {
  bloquear(true);
  nico.src = "nico-assets/celular.png";
  setChat("Dale Rodri... estoy guardando ese cliente.");

  const nombre = extraerDato(texto, "nombre") || "Cliente sin nombre";
  const direccion = extraerDato(texto, "direccion") || extraerDato(texto, "dirección") || "";
  const fecha = extraerDato(texto, "fecha") || extraerDato(texto, "hora") || "";
  const telefono = extraerDato(texto, "telefono") || extraerDato(texto, "teléfono") || extraerDato(texto, "whatsapp") || "";

  try {
    const res = await fetch(CREAR_CLIENTE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nombre, direccion, fecha, telefono, whatsapp: telefono })
    });

    if (!res.ok) throw new Error("Error creando cliente");

    const respuesta = `Listo Rodri... guardé el cliente ${nombre}.`;
    setChat(respuesta);
    hablarConVoz(respuesta);

  } catch (e) {
    console.log("Error cliente:", e);
    const respuesta = "Uff... no pude guardar ese cliente ahora. Revisemos los datos y probamos otra vez.";
    setChat(respuesta);
    hablarConVoz(respuesta);
  }
}

function guardarClienteRapido() {
  mensajeInput.value = "Guardar cliente: nombre: , dirección: , teléfono: , fecha: ";
  mensajeInput.focus();
}

// ==========================
// MICROFONO
// ==========================
function activarMicrofono() {
  if (ocupado) return;

  audioHabilitado = true;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    const respuesta = "Rodri... este navegador no me deja usar el micrófono. Probemos en Safari o Chrome actualizado.";
    setChat(respuesta);
    hablarConVoz(respuesta);
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "es-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  nico.src = "nico-assets/piensa.png";
  setChat("Te escucho, Rodri...");

  recognition.start();

  recognition.onresult = function(event) {
    const texto = event.results[0][0].transcript;
    setChat("Tú: " + texto);
    responderConIA(texto);
  };

  recognition.onerror = function(event) {
    console.log("Error mic:", event.error);
    const respuesta = "No te escuché bien bro. Probemos otra vez.";
    setChat(respuesta);
    hablarConVoz(respuesta);
  };
}

mensajeInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") enviarMensaje();
});
</script>

</body>
</html>
