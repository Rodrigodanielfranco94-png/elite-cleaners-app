<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico 🔥 Animado</title>

<style>
body{
  background:black;
  color:white;
  font-family:Arial;
  text-align:center;
}

#avatar{
  width:180px;
  height:300px;
  margin-top:40px;
  transition:0.3s;
}

button{
  margin-top:20px;
  padding:15px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:white;
}

#estado{
  margin-top:20px;
  font-size:18px;
}
</style>
</head>

<body>

<h1>Nico 🔥 Animado</h1>

<div id="estado">Nico en reposo...</div>
  
<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 0.6, 3.8);
camera.lookAt(0, 0.4, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true });
renderer.setSize(window.innerWidth, 650);

document.body.appendChild(renderer.domElement);

const light = new THREE.HemisphereLight(0xffffff, 0x444444, 3);
scene.add(light);
  
const frontLight = new THREE.DirectionalLight(0xffffff, 3);
frontLight.position.set(0, 3, 5);
scene.add(frontLight);

const estado = document.getElementById("estado");
const loader = new GLTFLoader();

loader.load(
  'assets/3d/Meshy_AI_Thumbs_Up_Teen_0520063851_texture.glb',
  function (gltf) {

    const model = gltf.scene;

model.scale.set(0.9, 0.9, 0.9);
model.position.set(0, -0.95, 0);

    scene.add(model);
    estado.innerText = "Nico 3D cargado ✅";

    animate();

    function animate() {
      requestAnimationFrame(animate);

      model.rotation.y = 0;

      renderer.render(scene, camera);
    }

  },
  undefined,
  function (error) {
    console.error(error);
  }
);
</script>
  
</body>
</html>
