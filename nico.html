<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico Realtime Labios</title>

<style>
body{
  background:#000;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  text-align:center;
  padding:18px;
  margin:0;
}

h1{
  font-size:30px;
  margin-top:25px;
}

.avatar-wrap{
  position:relative;
  width:310px;
  max-width:90%;
  margin:20px auto 10px;
}

#nicoAvatar{
  width:100%;
  transition:.25s ease;
  animation:respirar 3s ease-in-out infinite;
}

#boca{
  position:absolute;
  left:50%;
  top:31%;
  width:34px;
  height:8px;
  background:#2b0b0b;
  border-radius:50%;
  transform:translateX(-50%) scaleY(0.35);
  opacity:.85;
  transition:height .06s linear, transform .06s linear;
  pointer-events:none;
}

.hablando{
  filter:brightness(1.12);
}

.escuchando{
  filter:drop-shadow(0 0 18px #22c55e);
}

@keyframes respirar{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-4px) scale(1.01)}
}

.card{
  max-width:430px;
  margin:16px auto;
  background:#1c1c1e;
  padding:18px;
  border-radius:22px;
  font-size:18px;
  line-height:1.4;
}

button{
  width:90%;
  max-width:430px;
  padding:16px;
  border-radius:16px;
  border:none;
  margin:8px auto;
  font-weight:bold;
  font-size:16px;
  color:white;
  background:#2563eb;
  display:block;
}

.green{background:#16a34a}
.red{background:#dc2626}
.small{
  color:#8e8e93;
  font-size:13px;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>Nico Realtime</h1>

<div class="avatar-wrap">
  <img id="nicoAvatar" src="nico-assets/alegre.png" alt="Nico">
  <div id="boca"></div>
</div>

<div class="card" id="textoNico">
  Toca activar y habla conmigo, Rodri...
</div>

<button class="green" onclick="startNico()">🎙️ Activar Nico en vivo</button>
<button class="red" onclick="stopNico()">⛔ Detener Nico</button>

<div class="small">Nico con WebRTC + labios sincronizados por audio</div>

<script>
const CREAR_SESION_URL = "https://us-central1-elite-cleaners-app.cloudfunctions.net/crearSesionRealtime";

let pc = null;
let dc = null;
let audioElement = null;
let audioContext = null;
let analyser = null;
let animationId = null;
let conectado = false;

const avatar = document.getElementById("nicoAvatar");
const boca = document.getElementById("boca");
const textoNico = document.getElementById("textoNico");

async function startNico(){
  if(conectado) return;

  try{
    textoNico.innerText = "Conectando con Nico...";
    avatar.classList.add("escuchando");

    const tokenRes = await fetch(CREAR_SESION_URL);
    const data = await tokenRes.json();

    const EPHEMERAL_KEY = data.client_secret.value;

    pc = new RTCPeerConnection();

    audioElement = document.createElement("audio");
    audioElement.autoplay = true;
    audioElement.playsInline = true;

    pc.ontrack = async (event) => {
      const remoteStream = event.streams[0];
      audioElement.srcObject = remoteStream;

      try{
        await audioElement.play();
      }catch(e){
        console.log("iPhone bloqueó audio hasta tocar pantalla:", e);
      }

      iniciarLipSync(remoteStream);
    };

    const micStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    micStream.getTracks().forEach(track => pc.addTrack(track, micStream));

    dc = pc.createDataChannel("oai-events");

    dc.onopen = () => {
      conectado = true;
      textoNico.innerText = "Ey Rodri... te escucho.";
      avatar.classList.add("escuchando");
    };

    dc.onmessage = (event) => {
      try{
        const msg = JSON.parse(event.data);

        if(msg.type === "response.audio_transcript.delta"){
          if(textoNico.innerText === "Ey Rodri... te escucho.") textoNico.innerText = "";
          textoNico.innerText += msg.delta || "";
        }

        if(msg.type === "response.audio.delta"){
          avatar.classList.remove("escuchando");
          avatar.classList.add("hablando");
        }

        if(msg.type === "response.done"){
          avatar.classList.remove("hablando");
          avatar.classList.add("escuchando");
          cerrarBoca();
        }

      }catch(e){
        console.log(event.data);
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const sdpResponse = await fetch("https://api.openai.com/v1/realtime?model=gpt-realtime", {
      method:"POST",
      body:offer.sdp,
      headers:{
        Authorization:`Bearer ${EPHEMERAL_KEY}`,
        "Content-Type":"application/sdp"
      }
    });

    const answer = {
      type:"answer",
      sdp:await sdpResponse.text()
    };

    await pc.setRemoteDescription(answer);

  }catch(error){
    console.error("Error activando Nico:", error);
    textoNico.innerText = "Uff... no pude activar a Nico. Revisa la conexión o el backend.";
    cerrarBoca();
    avatar.classList.remove("escuchando","hablando");
  }
}

function iniciarLipSync(stream){
  try{
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(stream);

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;

    source.connect(analyser);

    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    function animarBoca(){
      analyser.getByteFrequencyData(dataArray);

      let suma = 0;
      for(let i = 0; i < dataArray.length; i++){
        suma += dataArray[i];
      }

      const volumen = suma / dataArray.length;

      const apertura = Math.min(34, Math.max(6, volumen / 3));
      const escala = Math.min(1.8, Math.max(0.35, volumen / 30));

      boca.style.height = apertura + "px";
      boca.style.transform = `translateX(-50%) scaleY(${escala})`;

      animationId = requestAnimationFrame(animarBoca);
    }

    animarBoca();

  }catch(e){
    console.log("Lip sync no disponible:", e);
  }
}

function cerrarBoca(){
  boca.style.height = "8px";
  boca.style.transform = "translateX(-50%) scaleY(0.35)";
}

function stopNico(){
  conectado = false;

  if(animationId) cancelAnimationFrame(animationId);
  animationId = null;

  if(audioContext) audioContext.close();
  audioContext = null;

  if(pc){
    pc.getSenders().forEach(sender => {
      if(sender.track) sender.track.stop();
    });
    pc.close();
  }

  pc = null;
  dc = null;

  avatar.classList.remove("escuchando","hablando");
  cerrarBoca();

  textoNico.innerText = "Nico está en pausa, Rodri.";
}
</script>

</body>
</html>
