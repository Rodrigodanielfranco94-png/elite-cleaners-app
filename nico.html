<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico Dios</title>

<style>
body {
  background:#000;
  color:white;
  font-family:-apple-system;
  text-align:center;
  padding:16px;
}

#nico { width:300px; }

#chat {
  background:#1c1c1e;
  padding:18px;
  border-radius:20px;
  margin-top:15px;
}

input {
  width:65%;
  padding:14px;
  border-radius:12px;
  border:none;
}

button {
  padding:14px;
  border-radius:12px;
  border:none;
  background:#3b82f6;
  color:white;
  font-weight:bold;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.mic-btn { background:#16a34a; }
.hidden { display:none; }
</style>
</head>

<body>

<h2>Nico - DIOS</h2>

<img id="nico" src="nico-assets/reposo.png">

<div id="chat">Ey Rodri 👋</div>

<br>

<input id="mensaje" placeholder="Escríbele a Nico...">
<button onclick="enviarMensaje()">Enviar</button>

<div class="grid">
  <button class="mic-btn" onclick="activarMicrofono()">🎙️ Hablar</button>
  <button onclick="respuestaRapida('animo')">Ánimo</button>

  <button onclick="respuestaRapida('hoy')">Hoy</button>
  <button onclick="respuestaRapida('mañana')">Mañana</button>

  <button onclick="respuestaRapida('trabajo')">Trabajo</button>
  <button onclick="respuestaRapida('musica')">Música</button>
</div>

<button id="btnAudio" class="hidden">🔊 Escuchar a Nico</button>

<script>

const VOZ_URL = "https://voznico-cnnxm2vdja-uc.a.run.app";
const IA_URL  = "https://pensarnico-cnnxm2vdja-uc.a.run.app";

let audioActual = null;
let audioHabilitado = false;

const chat = document.getElementById("chat");
const btnAudio = document.getElementById("btnAudio");
const nico = document.getElementById("nico");

function limpiarTexto(t){
  return t.replace(/[^\p{L}\p{N}\p{P}\p{Z}]/gu,"");
}

// 🔥 VOZ
async function hablar(texto){

  const res = await fetch(VOZ_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json"},
    body: JSON.stringify({ texto: limpiarTexto(texto) })
  });

  const blob = await res.blob();
  const url = URL.createObjectURL(blob);

  if(audioActual){
    audioActual.pause();
    audioActual.currentTime = 0;
  }

  audioActual = new Audio(url);

  window.playAudioNico = async ()=>{
    try{
      audioHabilitado = true;
      nico.src = "nico-assets/alegre.png";
      await audioActual.play();
    }catch(e){
      console.log("bloqueado");
    }
  };

  // 🔥 intento automático
  if(audioHabilitado){
    try{
      await window.playAudioNico();
    }catch{
      btnAudio.classList.remove("hidden");
    }
  }else{
    btnAudio.classList.remove("hidden");
  }
}

// botón fallback
btnAudio.onclick = ()=>{
  if(audioActual){
    window.playAudioNico();
  }
};

// 🔥 IA
async function pensar(mensaje){

  chat.innerHTML = "Pensando...";
  nico.src = "nico-assets/piensa.png";

  const res = await fetch(IA_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json"},
    body: JSON.stringify({ mensaje })
  });

  const data = await res.json();

  chat.innerHTML = data.respuesta;

  hablar(data.respuesta);
}

// enviar texto
function enviarMensaje(){
  const msg = document.getElementById("mensaje").value;
  if(!msg) return;

  pensar(msg);
  document.getElementById("mensaje").value = "";
}

// respuestas rápidas
function respuestaRapida(tipo){

  if(tipo==="animo"){
    pensar("Nico, dame ánimo como hermano.");
  }

  if(tipo==="trabajo"){
    pensar("Nico, organiza mi trabajo.");
  }

  if(tipo==="musica"){
    pensar("Nico, hablemos de música.");
  }

  if(tipo==="hoy"){
    pensar("Nico, qué trabajos tengo hoy?");
  }

  if(tipo==="mañana"){
    pensar("Nico, qué trabajos tengo mañana?");
  }
}

// 🎙️ MICRÓFONO (FIX REAL)
function activarMicrofono(){

  audioHabilitado = true;

  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.lang = "es-ES";

  recognition.start();

  recognition.onresult = async (event)=>{

    audioHabilitado = true;

    const texto = event.results[0][0].transcript;

    chat.innerHTML = "Tú: " + texto;

    setTimeout(()=>{
      pensar(texto);
    },250);
  };

  recognition.onerror = ()=>{
    chat.innerHTML = "No te escuché bien bro.";
  };
}

document.getElementById("mensaje").addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    enviarMensaje();
  }
});

</script>

</body>
</html>
