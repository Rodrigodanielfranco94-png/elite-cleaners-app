<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nico Assistant</title>

  <style>
    body {
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h2 {
      margin-top: 35px;
      font-size: 28px;
      font-weight: 800;
    }

    #nico {
      width: 320px;
      max-width: 90%;
      transition: 0.3s ease;
    }

    #chat {
      margin: 22px auto;
      background: #1c1c1e;
      padding: 18px;
      border-radius: 20px;
      max-width: 370px;
      font-size: 18px;
      display: none;
      line-height: 1.4;
    }

    .input-box {
      max-width: 370px;
      margin: 20px auto;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .quick-buttons {
      max-width: 370px;
      margin: 18px auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quick-buttons button {
      background: #1c1c1e;
      border: 1px solid #3b82f6;
      font-size: 15px;
    }

    .small-note {
      color: #8e8e93;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h2>Nico - Assistant</h2>

  <img id="nico" src="nico-assets/reposo.png" alt="Nico Assistant" />

  <div id="chat"></div>

  <div class="input-box">
    <input id="mensaje" type="text" placeholder="Escríbele a Nico..." />
    <button id="btnEnviar" onclick="enviarMensaje()">Enviar</button>
  </div>

  <div class="quick-buttons">
    <button onclick="respuestaRapida('hola')">Saludar</button>
    <button onclick="respuestaRapida('trabajo')">Trabajo</button>
    <button onclick="respuestaRapida('animo')">Ánimo</button>
    <button onclick="respuestaRapida('musica')">Música</button>
  </div>

  <div class="small-note">Nico habla con voz real usando ElevenLabs.</div>

  <script>
    const VOZ_NICO_URL = "https://us-central1-elite-cleaners-app.cloudfunctions.net/vozNico";

    const nico = document.getElementById("nico");
    const chat = document.getElementById("chat");
    const mensajeInput = document.getElementById("mensaje");
    const btnEnviar = document.getElementById("btnEnviar");

    let audioActual = null;
    let hablando = false;

    function limpiarTextoParaVoz(texto) {
      return texto
        .replace(/😄|🔥|💙|👌🏻|🤣|🙏|💪|🎙️|😎|🌟/g, "")
        .replace(/[^\p{L}\p{N}\p{P}\p{Z}¿¡áéíóúÁÉÍÓÚñÑ]/gu, "")
        .trim();
    }

    function bloquearBotones(bloquear) {
      hablando = bloquear;
      btnEnviar.disabled = bloquear;
      document.querySelectorAll(".quick-buttons button").forEach(btn => {
        btn.disabled = bloquear;
      });
    }

    async function hablarConVoz(texto) {
      try {
        if (audioActual) {
          audioActual.pause();
          audioActual.currentTime = 0;
        }

        const textoLimpio = limpiarTextoParaVoz(texto);

        const response = await fetch(VOZ_NICO_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            texto: textoLimpio
          })
        });

        if (!response.ok) {
          throw new Error("No se pudo generar la voz de Nico");
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        audioActual = new Audio(audioUrl);

        audioActual.onplay = () => {
          nico.src = "nico-assets/alegre.png";
        };

        audioActual.onended = () => {
          nico.src = "nico-assets/reposo.png";
          bloquearBotones(false);
          URL.revokeObjectURL(audioUrl);
        };

        audioActual.onerror = () => {
          bloquearBotones(false);
        };

        await audioActual.play();

      } catch (error) {
        console.error("Error con voz real de Nico:", error);
        bloquearBotones(false);
        hablarConVozTemporal(texto);
      }
    }

    function hablarConVozTemporal(texto) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      const audio = new SpeechSynthesisUtterance(limpiarTextoParaVoz(texto));
      audio.lang = "es-US";
      audio.pitch = 0.85;
      audio.rate = 0.92;
      audio.volume = 1;

      window.speechSynthesis.speak(audio);
    }

    function mostrarRespuesta(texto, imagen) {
      if (hablando) return;

      bloquearBotones(true);

      nico.src = "nico-assets/piensa.png";
      chat.style.display = "block";
      chat.innerText = "Nico está pensando...";

      setTimeout(() => {
        nico.src = imagen;
        chat.innerText = texto;
        hablarConVoz(texto);
      }, 800);
    }

    function enviarMensaje() {
      const mensajeOriginal = mensajeInput.value.trim();
      const mensaje = mensajeOriginal.toLowerCase();

      if (!mensaje || hablando) return;

      let respuesta = "";
      let imagen = "nico-assets/alegre.png";

      if (mensaje.includes("hola") || mensaje.includes("nico") || mensaje.includes("qué tal") || mensaje.includes("que tal")) {
        respuesta = "Ey Rodri, aquí estoy contigo, bro. Cuéntame, qué hacemos hoy.";
        imagen = "nico-assets/saluda.png";
      } 
      else if (mensaje.includes("trabajo") || mensaje.includes("cliente") || mensaje.includes("limpieza") || mensaje.includes("elite")) {
        respuesta = "Bro, vamos con orden. Primero cliente, dirección, hora, tipo de limpieza y equipo asignado. Así Elite Cleaners Company trabaja fino.";
        imagen = "nico-assets/celular.png";
      } 
      else if (mensaje.includes("cansado") || mensaje.includes("triste") || mensaje.includes("difícil") || mensaje.includes("preocupado")) {
        respuesta = "Ey bro, respira. Yo sé que a veces pesa, pero tú has levantado mucho. Vamos paso a paso, sin rendirnos.";
        imagen = "nico-assets/reposo.png";
      } 
      else if (mensaje.includes("música") || mensaje.includes("musica") || mensaje.includes("guitarra") || mensaje.includes("cantar")) {
        respuesta = "Eso sí me gusta, bro. Una guitarra, una canción y esa energía de los domingos en la casa de papá.";
        imagen = "nico-assets/canta.png";
      }
      else if (mensaje.includes("gracias")) {
        respuesta = "Siempre, Rodri. Para eso estoy, bro. Vamos con toda.";
        imagen = "nico-assets/alegre.png";
      }
      else if (mensaje.includes("familia") || mensaje.includes("papá") || mensaje.includes("papa") || mensaje.includes("jorge") || mensaje.includes("dayana") || mensaje.includes("charlie")) {
        respuesta = "La familia siempre va primero, bro. Papá Rodolfo, Jorge, Dayana, Charlie... todos son parte de esto también.";
        imagen = "nico-assets/reposo.png";
      }
      else {
        respuesta = "Te escucho, Rodri. Cuéntame bien y lo resolvemos juntos.";
        imagen = "nico-assets/piensa.png";
      }

      mensajeInput.value = "";
      mostrarRespuesta(respuesta, imagen);
    }

    function respuestaRapida(tipo) {
      if (hablando) return;

      if (tipo === "hola") {
        mostrarRespuesta("Ey Rodri, aquí estoy contigo, bro. Qué hacemos hoy.", "nico-assets/saluda.png");
      }

      if (tipo === "trabajo") {
        mostrarRespuesta("Vamos con Elite Cleaners Company. Clientes claros, agenda clara y todo bien organizado.", "nico-assets/celular.png");
      }

      if (tipo === "animo") {
        mostrarRespuesta("Bro, acuérdate: paso a paso también se llega lejos. Yo estoy contigo.", "nico-assets/alegre.png");
      }

      if (tipo === "musica") {
        mostrarRespuesta("Una musiquita y seguimos con toda, como cuando cantábamos en la casa de papá.", "nico-assets/canta.png");
      }
    }

    mensajeInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        enviarMensaje();
      }
    });
  </script>

</body>
</html>
