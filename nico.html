<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nico Assistant</title>

<style>
body {
  background: #000;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  text-align: center;
  padding: 20px;
}

#nico {
  width: 280px;
  margin-top: 20px;
}

#chat {
  margin: 20px auto;
  background: #1c1c1e;
  padding: 15px;
  border-radius: 20px;
  max-width: 350px;
}

input {
  width: 70%;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #3b82f6;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.quick-buttons button {
  margin: 5px;
  background: #111;
  border: 1px solid #3b82f6;
}
</style>
</head>

<body>

<h2>Nico - Assistant</h2>

<img id="nico" src="nico-assets/reposo.png">

<div id="chat">Hola Rodri 👋</div>

<br>

<input id="mensaje" placeholder="Escríbele a Nico...">
<button onclick="enviarMensaje()">Enviar</button>

<div class="quick-buttons">
  <button onclick="respuestaRapida('hola')">Saludar</button>
  <button onclick="respuestaRapida('trabajo')">Trabajo</button>
  <button onclick="respuestaRapida('animo')">Ánimo</button>
  <button onclick="respuestaRapida('musica')">Música</button>
</div>

<script>

const VOZ_NICO_URL = "https://us-central1-elite-cleaners-app.cloudfunctions.net/vozNico";

const chat = document.getElementById("chat");
const mensajeInput = document.getElementById("mensaje");

function limpiarTexto(texto){
  return texto.replace(/[^\p{L}\p{N}\p{P}\p{Z}]/gu, "");
}

// 🔥 FUNCIÓN QUE SÍ FUNCIONA EN IPHONE
async function hablarConVoz(texto){

  try{

    const res = await fetch(VOZ_NICO_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json"},
      body: JSON.stringify({ texto: limpiarTexto(texto) })
    });

    if(!res.ok){
      throw new Error("Error backend");
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    // 🔥 AUDIO HTML (SOLUCIÓN REAL)
    chat.innerHTML += `
      <br>
      <audio controls autoplay style="width:100%;margin-top:10px">
        <source src="${url}" type="audio/mpeg">
      </audio>
    `;

  }catch(e){
    console.log("Error voz:", e);
  }
}

function responder(texto){
  chat.innerHTML = texto;
  hablarConVoz(texto);
}

function enviarMensaje(){

  const msg = mensajeInput.value.toLowerCase();

  if(!msg) return;

  if(msg.includes("hola")){
    responder("Ey Rodri, aquí estoy contigo bro.");
  }
  else if(msg.includes("trabajo")){
    responder("Vamos con orden bro, cliente, dirección y equipo.");
  }
  else if(msg.includes("animo")){
    responder("Respira bro, tú puedes con esto.");
  }
  else if(msg.includes("musica")){
    responder("Como los domingos con papá.");
  }
  else{
    responder("Te escucho bro, cuéntame.");
  }

  mensajeInput.value = "";
}

function respuestaRapida(tipo){

  if(tipo==="hola"){
    responder("Ey Rodri, aquí estoy contigo bro.");
  }

  if(tipo==="trabajo"){
    responder("Vamos con Elite Cleaners bien organizado.");
  }

  if(tipo==="animo"){
    responder("Paso a paso bro, tú puedes.");
  }

  if(tipo==="musica"){
    responder("Como los domingos con papá.");
  }
}

mensajeInput.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    enviarMensaje();
  }
});

</script>

</body>
</html>
