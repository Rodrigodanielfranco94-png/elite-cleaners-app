<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Admin - Elite Cleaners Company</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { background: #000; color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; padding-bottom: 120px; overflow-x: hidden; }
        h1 { font-style: italic; font-weight: 900; font-size: 22px; text-transform: uppercase; margin-bottom: 20px; }
        h1 span { color: #3b82f6; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1c1c1e; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #2c2c2e; cursor: pointer; transition: 0.3s; }
        .stat-card.active { border-color: #3b82f6; background: #1a2638; }
        .stat-card h2 { margin: 0; font-size: 28px; color: #3b82f6; }
        .stat-card p { margin: 5px 0 0 0; font-size: 10px; color: #8e8e93; text-transform: uppercase; }
        .form-container { background: #1c1c1e; padding: 18px; border-radius: 20px; border: 1px solid #2c2c2e; margin-bottom: 20px; }
        .section-staff { border-color: #3b82f6; border-style: dashed; }
        .label-text { font-size: 10px; color: #3b82f6; font-weight: bold; margin: 8px 0 4px 5px; display: block; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #2c2c2e; background: #2c2c2e; color: white; box-sizing: border-box; font-size: 15px; }
        .staff-list { margin-top: 15px; border-top: 1px solid #2c2c2e; padding-top: 15px; }
        .staff-item { background: #000; padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2c2c2e; }
        .staff-info b { font-size: 13px; color: #fff; display: block; }
        .staff-info span { font-size: 10px; color: #8e8e93; }
        .staff-actions { display: flex; gap: 5px; }
        .btn-mini { padding: 6px 10px; border: none; border-radius: 6px; font-size: 9px; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; }
        .search-container { position: relative; margin-bottom: 5px; }
        .suggestions-list { position: absolute; width: 100%; background: #3b82f6; border-radius: 10px; z-index: 100; max-height: 150px; overflow-y: auto; display: none; }
        .suggestion-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-weight: bold; }
        .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .type-btn { padding: 12px; border-radius: 10px; border: 1px solid #2c2c2e; background: #2c2c2e; color: #8e8e93; font-weight: bold; font-size: 10px; cursor: pointer; text-transform: uppercase; }
        .type-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
        .save-btn { width: 100%; padding: 18px; background: #3b82f6; color: white; border: none; border-radius: 15px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; text-transform: uppercase; }
        .reg-btn { background: #3b82f6; color: white; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; margin-top: 5px; text-transform: uppercase; }
        .card-servicio { background: #1c1c1e; padding: 20px; border-radius: 25px; border: 1px solid #2c2c2e; margin-bottom: 15px; position: relative; }
        .chat-btn { position: absolute; right: 15px; top: 15px; width: 45px; height: 45px; background: #007aff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; text-decoration: none; border: none; cursor: pointer; color: white; }
        .card-servicio h3 { margin: 0 0 5px 0; color: #3b82f6; font-size: 20px; max-width: 80%; }
        .card-servicio p { margin: 4px 0; font-size: 13px; color: #d1d5db; }
        .time-box { background: #000; padding: 12px; border-radius: 15px; margin-top: 15px; border: 1px solid #3b82f633; }
        .time-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
        .time-row b { color: #3b82f6; font-size: 10px; text-transform: uppercase; }
        .total-time-row { border-top: 1px solid #3b82f6; margin-top: 8px; padding-top: 8px; font-weight: bold; color: #22c55e !important; }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-action { padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 11px; cursor: pointer; text-transform: uppercase; }
        .btn-done { background: #22c55e; } .btn-edit { background: #6366f1; } .btn-delete { background: #ef4444; } .btn-contract { background: #004a99; } .btn-review { background: #3b82f6; border: 1px solid #ffffff33; }
        .payroll-container { background: #1c1c1e; padding: 18px; border-radius: 20px; border: 1px solid #22c55e; margin-top: 30px; }
        .payroll-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        .payroll-table th { text-align: left; color: #22c55e; padding: 8px; border-bottom: 1px solid #2c2c2e; text-transform: uppercase; font-size: 10px; }
        .payroll-table td { padding: 10px 8px; border-bottom: 1px solid #2c2c2e; }

        #nico-container { position: fixed; bottom: 15px; right: 15px; width: 100px; height: 100px; z-index: 9999; cursor: pointer; animation: flotarNico 3s ease-in-out infinite; }
        #nico-caricatura { width: 100%; height: 100%; object-fit: contain; }
        #nico-burbuja { position: fixed; bottom: 110px; right: 25px; background: white; color: black; padding: 15px; border-radius: 20px; max-width: 250px; font-size: 14px; font-weight: bold; display: none; z-index: 10000; border: 2px solid #3b82f6; }
        @keyframes flotarNico { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <h1>ELITE <span>ADMIN</span></h1>

    <div id="nico-burbuja">💭 ¡Hola Rodrigo! Soy Nico.</div>
    <div id="nico-container" onclick="activarNicoBuddy()">
        <img id="nico-caricatura" src="nico-assets/saluda.png" alt="Nico">
    </div>

    <div class="stats-grid">
        <div class="stat-card active" id="btn-pendientes" onclick="cambiarVista('pendiente')">
            <h2 id="count-pendientes">0</h2>
            <p>Pendientes</p>
        </div>
        <div class="stat-card" id="btn-completados" onclick="cambiarVista('completado')">
            <h2 id="count-completados">0</h2>
            <p>Completados</p>
        </div>
    </div>

    <div class="form-container section-staff">
        <span class="label-text">Gestión de Personal</span>
        <input type="hidden" id="edit-staff-id">
        <input type="text" id="reg-nombre" placeholder="Nombre completo">
        <input type="email" id="reg-email" placeholder="Correo electrónico">
        <input type="number" id="reg-pago" placeholder="Pago por hora ($)">
        <button class="reg-btn" id="btn-staff-main" onclick="registrarStaff()">GUARDAR STAFF</button>
        <div class="staff-list" id="lista-visual-staff"></div>
    </div>

    <div class="form-container" id="main-form">
        <input type="hidden" id="edit-id">
        <span class="label-text">Cliente</span>
        <div class="search-container">
            <input type="text" id="cliente" placeholder="Nombre" oninput="filtrarClientes()">
            <div id="suggestions-clientes" class="suggestions-list"></div>
        </div>
        <input type="text" id="direccion" placeholder="Dirección">
        <input type="tel" id="whatsapp" placeholder="WhatsApp">
        
        <span class="label-text">Staff 1</span>
        <input type="text" id="search-empleado" placeholder="Buscar staff 1..." oninput="filtrarEmpleados(1)">
        <div id="suggestions-1" class="suggestions-list"></div>
        <input type="hidden" id="email-empleado">

        <span class="label-text">Staff 2</span>
        <input type="text" id="search-empleado-2" placeholder="Buscar staff 2..." oninput="filtrarEmpleados(2)">
        <div id="suggestions-2" class="suggestions-list"></div>
        <input type="hidden" id="email-empleado-2">
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="date" id="fecha">
            <input type="time" id="hora">
        </div>
        <textarea id="notas" placeholder="Notas..." rows="2"></textarea>

        <div class="type-grid">
            <button class="type-btn active" id="btn-ESTÁNDAR" onclick="selectType('ESTÁNDAR')">ESTÁNDAR</button>
            <button class="type-btn" id="btn-PROFUNDA" onclick="selectType('PROFUNDA')">PROFUNDA</button>
            <button class="type-btn" id="btn-MOVE-IN" onclick="selectType('MOVE-IN')">MOVE-IN</button>
            <button class="type-btn" id="btn-MOVE-OUT" onclick="selectType('MOVE-OUT')">MOVE-OUT</button>
            <button class="type-btn" id="btn-PRIMERA" onclick="selectType('PRIMERA')">PRIMERA</button>
            <button class="type-btn" id="btn-POST" onclick="selectType('POST')">POST-CONSTR</button>
        </div>
        <button class="save-btn" id="main-button" onclick="asignarTrabajo()">ASIGNAR TRABAJO</button>
    </div>

    <div id="historial"></div>

    <div class="payroll-container">
        <span class="label-text" style="color:#22c55e;">Nómina</span>
        <table class="payroll-table">
            <thead><tr><th>Staff</th><th>Horas</th><th>Total</th></tr></thead>
            <tbody id="lista-nomina"></tbody>
        </table>
    </div>

    <div id="modal-firma">
        <div class="modal-content" id="capture-area">
            <h2 style="color:#fff; text-align:center;">ELITE CLEANERS</h2>
            <p id="modal-cliente" style="color:#3b82f6; text-align: center; font-weight:bold;"></p>
            <div class="legal-view">
                <span class="title-contract">CONTRATO DE SERVICIOS</span>
                <b>• CLÁUSULA 8: PROTECCIÓN DE TALENTO</b> Multa de $2,500 USD por contratación directa.
            </div>
            <img id="modal-img-firma" src="" style="width:100%; height:120px; background:#fff; border-radius:12px;">
        </div>
        <div class="modal-footer"><button class="btn-modal btn-descargar" onclick="descargarComprobante()">Descargar</button><button class="btn-modal btn-cerrar" onclick="document.getElementById('modal-firma').style.display='none'">Cerrar</button></div>
    </div>

    <script>
        const ELEVEN_KEY = "sk_3bfbc7679725723c15ea43c588edb154a07755bf66174dcc";
        const VOICE_ID = "pNInz6obpg8ndclKuzt1";
        let audioCtx;

        async function nicoResponde(texto) {
            const b = document.getElementById('nico-burbuja'); b.innerText = "💭 " + texto; b.style.display = 'block';
            setTimeout(() => b.style.display = 'none', 8000);
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'xi-api-key': ELEVEN_KEY }, body: JSON.stringify({ text: texto, model_id: "eleven_multilingual_v2" }) });
                if (res.ok) { const blob = await res.blob(); new Audio(URL.createObjectURL(blob)).play(); }
            } catch (e) { console.error(e); }
        }

        function activarNicoBuddy() {
            const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (Rec) {
                const mic = new Rec(); mic.lang = 'es-ES';
                mic.onresult = (e) => {
                    const f = e.results[0][0].transcript.toLowerCase();
                    const p = document.getElementById('count-pendientes').innerText;
                    if (f.includes("pendiente") || f.includes("trabajo")) nicoResponde(`Rodrigo, ahora mismo tenemos ${p} trabajos pendientes.`);
                    else nicoResponde("¡Hola Rodrigo! Soy Nico, ¿en qué te ayudo?");
                };
                mic.start();
            }
        }

        const firebaseConfig = { apiKey: "AIzaSyDB4F55StoX8WYYzCm8oSnucc-lrH", authDomain: "elite-cleaners-app.firebaseapp.com", projectId: "elite-cleaners-app", storageBucket: "elite-cleaners-app.appspot.com", messagingSenderId: "826642317319", appId: "1:826642317319:web:cddce7904b590ae" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let todosLosServicios = [], todosLosEmpleados = [], todosLosClientes = [], vistaActual = "pendiente", tipoSeleccionado = "ESTÁNDAR";

        db.collection("usuarios").where("rol", "==", "empleado").onSnapshot(snap => {
            todosLosEmpleados = []; document.getElementById('lista-visual-staff').innerHTML = "";
            snap.forEach(doc => { const e = doc.data(); todosLosEmpleados.push({id: doc.id, ...e}); document.getElementById('lista-visual-staff').innerHTML += `<div class="staff-item"><b>${e.nombre}</b><span>$${e.pago_hora}/hr</span> <div class="staff-actions"><button class="btn-mini" style="background:#6366f1" onclick="editarStaff('${doc.id}','${e.nombre}','${e.email}','${e.pago_hora}')">Editar</button><button class="btn-mini" style="background:#ef4444" onclick="borrarStaff('${doc.id}','${e.nombre}')">Eliminar</button></div></div>`; });
            generarNomina();
        });
        db.collection("clientes").onSnapshot(snap => { todosLosClientes = []; snap.forEach(doc => todosLosClientes.push(doc.data())); });
        db.collection("servicios").onSnapshot(snap => {
            todosLosServicios = []; snap.forEach(doc => todosLosServicios.push({ id: doc.id, ...doc.data() }));
            document.getElementById('count-pendientes').innerText = todosLosServicios.filter(s => s.estado !== 'completado').length;
            document.getElementById('count-completados').innerText = todosLosServicios.filter(s => s.estado === 'completado').length;
            renderHistorial(); generarNomina();
        });

        function renderHistorial() {
            const h = document.getElementById('historial'); h.innerHTML = "";
            todosLosServicios.forEach(s => {
                if((vistaActual === "pendiente" && s.estado !== "completado") || (vistaActual === "completado" && s.estado === "completado")) {
                    const t = calcularTiempo(s.hora_inicio, s.hora_fin);
                    const btnFirma = s.firma_cliente ? `<button class="btn-action" style="background:#22c55e;" onclick="verFirma('${s.id}')">Ver Firma</button>` : `<button class="btn-action btn-contract" onclick="enviarContrato('${s.id}', '${s.whatsapp}', '${s.cliente}')">Contrato</button>`;
                    h.innerHTML += `<div class="card-servicio">
                        <button class="chat-btn" onclick="window.location.href='sms:${s.whatsapp}'">💬</button>
                        <h3>${s.cliente}</h3><p>📅 ${s.fecha} (${s.tipo})</p><p>👤 ${s.empleado_nombre_2 ? s.empleado_nombre+' & '+s.empleado_nombre_2 : s.empleado_nombre}</p>
                        <div class="time-box"><div class="time-row"><b>Inicio:</b> ${s.hora_inicio || "--"} | <b>Fin:</b> ${s.hora_fin || "--"}</div><div class="time-row total-time-row"><b>Tiempo:</b> ${t.texto}</div></div>
                        <div class="action-buttons">
                            <button class="btn-action btn-done" onclick="marcar('${s.id}', '${s.estado === 'completado' ? 'pendiente' : 'completado'}')">Estado</button>
                            ${btnFirma}
                            <button class="btn-action btn-review" onclick="window.location.href='https://wa.me/${s.whatsapp}?text=Reseña'">Reseña ⭐️</button>
                            <button class="btn-action btn-edit" onclick='editar("${s.id}", ${JSON.stringify(s)})'>Editar</button>
                            <button class="btn-action btn-delete" onclick="borrar('${s.id}')">Eliminar</button>
                        </div></div>`;
                }
            });
        }

        function calcularTiempo(i, f) {
            if(!i || !f || i === "--:--") return { texto: "0h", min: 0 };
            const parse = (h) => { const [hh, mm] = h.split(':').map(Number); return hh * 60 + mm; };
            const diff = parse(f) - parse(i); return { texto: `${Math.floor(diff/60)}h ${diff%60}m`, min: diff };
        }
        function filtrarClientes() {
            const q = document.getElementById('cliente').value.toLowerCase(); const l = document.getElementById('suggestions-clientes'); l.innerHTML = "";
            const f = todosLosClientes.filter(c => c.nombre.toLowerCase().includes(q));
            f.forEach(c => { const d = document.createElement('div'); d.className = 'suggestion-item'; d.innerText = c.nombre; d.onclick = () => { document.getElementById('cliente').value = c.nombre; document.getElementById('direccion').value = c.direccion; document.getElementById('whatsapp').value = c.whatsapp; l.style.display = "none"; }; l.appendChild(d); });
            l.style.display = f.length > 0 ? "block" : "none";
        }
        function filtrarEmpleados(num) {
            const id = num === 1 ? 'search-empleado' : 'search-empleado-2'; const sug = num === 1 ? 'suggestions-1' : 'suggestions-2'; const em = num === 1 ? 'email-empleado' : 'email-empleado-2';
            const q = document.getElementById(id).value.toLowerCase(); const l = document.getElementById(sug); l.innerHTML = "";
            const f = todosLosEmpleados.filter(e => e.nombre.toLowerCase().includes(q));
            f.forEach(e => { const d = document.createElement('div'); d.className = 'suggestion-item'; d.innerText = e.nombre; d.onclick = () => { document.getElementById(id).value = e.nombre; document.getElementById(em).value = e.email; l.style.display = "none"; }; l.appendChild(d); });
            l.style.display = f.length > 0 ? "block" : "none";
        }
        function registrarStaff() { const n = document.getElementById('reg-nombre').value, e = document.getElementById('reg-email').value, p = document.getElementById('reg-pago').value; db.collection("usuarios").add({ nombre: n, email: e, pago_hora: p, rol: "empleado" }); }
        function editarStaff(id, n, e, p) { document.getElementById('edit-staff-id').value = id; document.getElementById('reg-nombre').value = n; document.getElementById('reg-email').value = e; document.getElementById('reg-pago').value = p; document.getElementById('btn-staff-main').innerText = "ACTUALIZAR STAFF"; }
        function borrarStaff(id, n) { if(confirm(`Eliminar ${n}?`)) db.collection("usuarios").doc(id).delete(); }
        function asignarTrabajo() { const data = { cliente: document.getElementById('cliente').value, direccion: document.getElementById('direccion').value, whatsapp: document.getElementById('whatsapp').value, empleado_nombre: document.getElementById('search-empleado').value, empleado_email: document.getElementById('email-empleado').value, empleado_nombre_2: document.getElementById('search-empleado-2').value, empleado_email_2: document.getElementById('email-empleado-2').value, fecha: document.getElementById('fecha').value, hora: document.getElementById('hora').value, notas: document.getElementById('notas').value, tipo: tipoSeleccionado, estado: "pendiente", hora_inicio: "--:--", hora_fin: "--:--" }; db.collection("servicios").add(data).then(() => location.reload()); }
        function generarNomina() { const tabla = document.getElementById('lista-nomina'); tabla.innerHTML = ""; todosLosEmpleados.forEach(emp => { let m = 0; todosLosServicios.filter(s => s.estado === "completado" && (s.empleado_email === emp.email || s.empleado_email_2 === emp.email)).forEach(s => m += calcularTiempo(s.hora_inicio, s.hora_fin).minutos); if(m > 0) tabla.innerHTML += `<tr><td><b>${emp.nombre}</b></td><td>${Math.floor(m/60)}h</td><td class="pay-amount">$${((m/60)*emp.pago_hora).toFixed(2)}</td></tr>`; }); }
        function selectType(t) { tipoSeleccionado = t; document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); }
        function marcar(id, est) { db.collection("servicios").doc(id).update({ estado: est }); }
        function borrar(id) { if(confirm("¿Borrar?")) db.collection("servicios").doc(id).delete(); }
        function enviarContrato(id, t, c) { const url = `https://rodrigodanielfranco94-png.github.io/elite-cleaners-app/firmar.html?id=${id}&cliente=${encodeURIComponent(c)}`; window.location.href = `https://wa.me/${t}?text=Firma tu contrato: ${url}`; }
        function verFirma(id) { const s = todosLosServicios.find(x => x.id === id); document.getElementById('modal-cliente').innerText = "CLIENTE: " + s.cliente; document.getElementById('modal-img-firma').src = s.firma_imagen; document.getElementById('modal-firma').style.display = 'block'; }
        function editar(id, s) { document.getElementById('edit-id').value = id; document.getElementById('cliente').value = s.cliente; document.getElementById('search-empleado').value = s.empleado_nombre; document.getElementById('search-empleado-2').value = s.empleado_nombre_2 || ""; }
        function descargarComprobante() { const area = document.getElementById('capture-area'); html2canvas(area).then(canvas => { const link = document.createElement('a'); link.download = 'Contrato.png'; link.href = canvas.toDataURL(); link.click(); }); }
        function cambiarVista(v) { vistaActual = v; renderHistorial(); }
    </script>
</body>
</html>
