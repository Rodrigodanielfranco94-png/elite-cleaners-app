<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Admin - Elite Cleaners Company</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background: #000; color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; padding-bottom: 100px; overflow-x: hidden; }
        h1 { font-style: italic; font-weight: 900; font-size: 22px; text-transform: uppercase; margin-bottom: 20px; }
        h1 span { color: #3b82f6; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1c1c1e; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #2c2c2e; cursor: pointer; transition: 0.3s; }
        .stat-card.active { border-color: #3b82f6; background: #1a2638; }
        .stat-card h2 { margin: 0; font-size: 28px; color: #3b82f6; }
        .stat-card p { margin: 5px 0 0 0; font-size: 10px; color: #8e8e93; text-transform: uppercase; }
        .form-container { background: #1c1c1e; padding: 18px; border-radius: 20px; border: 1px solid #2c2c2e; margin-bottom: 20px; }
        .section-staff { border-color: #3b82f6; border-style: dashed; }
        .label-text { font-size: 10px; color: #3b82f6; font-weight: bold; margin: 8px 0 4px 5px; display: block; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #2c2c2e; background: #2c2c2e; color: white; box-sizing: border-box; font-size: 15px; }
        .staff-list { margin-top: 15px; border-top: 1px solid #2c2c2e; padding-top: 15px; }
        .staff-item { background: #000; padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; border: 1px solid #2c2c2e; }
        .card-servicio { background: #1c1c1e; padding: 20px; border-radius: 25px; border: 1px solid #2c2c2e; margin-bottom: 15px; position: relative; }
        .payroll-container { background: #1c1c1e; padding: 18px; border-radius: 20px; border: 1px solid #22c55e; margin-top: 30px; }
        #nico-container { position: fixed; bottom: 15px; right: 15px; width: 110px; height: 110px; z-index: 9999; cursor: pointer; transition: all 1.5s ease-in-out; filter: drop-shadow(0 5px 15px rgba(59, 130, 246, 0.4)); }
        #nico-caricatura { width: 100%; height: 100%; object-fit: contain; }
        #nico-burbuja { position: absolute; top: -80px; right: 0; background: white; color: black; padding: 12px; border-radius: 15px; font-size: 12px; font-weight: bold; display: none; width: 160px; border: 2px solid #3b82f6; z-index: 10000; }
        .nico-escuchando { filter: drop-shadow(0 0 25px #ef4444) !important; animation: vibrar 0.1s infinite; }
        @keyframes vibrar { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <h1>ELITE <span>ADMIN</span></h1>
    <div id="nico-container" onclick="activarNicoBuddy()">
        <div id="nico-burbuja">¡Hola Rodrigo!</div>
        <img id="nico-caricatura" src="nico-assets/saluda.png" alt="Nico">
    </div>
    <div class="stats-grid">
        <div class="stat-card active" id="btn-pendientes" onclick="cambiarVista('pendiente')"><h2 id="count-pendientes">0</h2><p>Pendientes</p></div>
        <div class="stat-card" id="btn-completados" onclick="cambiarVista('completado')"><h2 id="count-completados">0</h2><p>Completados</p></div>
    </div>
    <div class="form-container section-staff">
        <span class="label-text">Gestión de Personal</span>
        <input type="hidden" id="edit-staff-id">
        <input type="text" id="reg-nombre" placeholder="Nombre completo">
        <input type="email" id="reg-email" placeholder="Correo electrónico">
        <input type="number" id="reg-pago" placeholder="Pago por hora ($)">
        <button class="reg-btn" id="btn-staff-main" onclick="registrarStaff()">GUARDAR STAFF</button>
        <div class="staff-list" id="lista-visual-staff"></div>
    </div>
    <div class="form-container" id="main-form">
        <input type="hidden" id="edit-id">
        <span class="label-text">Cliente</span>
        <input type="text" id="cliente" placeholder="Nombre completo" oninput="filtrarClientes()">
        <input type="text" id="direccion" placeholder="Dirección">
        <input type="tel" id="whatsapp" placeholder="WhatsApp">
        <span class="label-text">Staff</span>
        <input type="text" id="search-empleado" placeholder="Buscar staff..." oninput="filtrarEmpleados(1)">
        <input type="hidden" id="email-empleado">
        <button class="save-btn" id="main-button" onclick="asignarTrabajo()">ASIGNAR TRABAJO</button>
    </div>
    <div id="historial"></div>
    <div class="payroll-container"><tbody id="lista-nomina"></tbody><button class="btn-reset" onclick="reiniciarHorasMes()">Reiniciar Mes</button></div>
    <script>
        const API_KEY_NICO = "sk_3bfbc7679725723c15ea43c588edb154a07755bf66174dcc";
        const VOICE_ID_NICO = "pNInz6obpg8ndclKuzt1";
        let audioCtx;

        function cambiarPoseNico(p) { 
            const img = document.getElementById('nico-caricatura');
            img.src = `nico-assets/${p}.png`; 
        }

        function moverNico() {
            const n = document.getElementById('nico-container');
            cambiarPoseNico('vuela');
            n.style.left = Math.random() * (window.innerWidth - 120) + 'px';
            n.style.top = Math.random() * (window.innerHeight - 200) + 50 + 'px';
            setTimeout(() => cambiarPoseNico('reposo'), 2000);
        }
        setInterval(moverNico, 20000);

        function obtenerRespuesta(t) {
            const frase = t.toLowerCase();
            cambiarPoseNico('habla');
            const p = document.getElementById('count-pendientes').innerText;
            if (frase.includes("pendientes")) return `Rodrigo, tienes ${p} servicios pendientes en Elite Cleaners Company.`;
            return "¡Aquí estoy Rodrigo! Listo para ayudarte.";
        }

        async function nicoResponde(t) {
            const b = document.getElementById('nico-burbuja');
            b.innerText = t; b.style.display = 'block';
            setTimeout(() => { b.style.display = 'none'; cambiarPoseNico('reposo'); }, 6000);
            try {
                if (!audioCtx) audioCtx = new AudioContext();
                const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID_NICO}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'xi-api-key': API_KEY_NICO },
                    body: JSON.stringify({ text: t, model_id: "eleven_multilingual_v2" })
                });
                if (r.ok) { const blob = await r.blob(); new Audio(URL.createObjectURL(blob)).play(); }
            } catch (e) { console.error(e); }
        }

        function activarNicoBuddy() {
            const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (Rec) {
                const mic = new Rec(); mic.lang = 'es-ES';
                mic.onstart = () => { document.getElementById('nico-container').classList.add('nico-escuchando'); cambiarPoseNico('saluda'); };
                mic.onresult = (e) => { nicoResponde(obtenerRespuesta(e.results[0][0].transcript)); };
                mic.onend = () => document.getElementById('nico-container').classList.remove('nico-escuchando');
                mic.start();
            }
        }

        const firebaseConfig = { apiKey: "AIzaSyDB4F55StoX8WYYzCm8oSnucc-lrH", authDomain: "elite-cleaners-app.firebaseapp.com", projectId: "elite-cleaners-app", storageBucket: "elite-cleaners-app.appspot.com", messagingSenderId: "826642317319", appId: "1:826642317319:web:cddce7904b590ae" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        // (Aquí sigue el resto de tus funciones de Firebase: cambiarVista, registrarStaff, etc.)
    </script>
</body>
</html>
