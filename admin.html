<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Admin - Elite Cleaners Company</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body { background: #000; color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; padding-bottom: 120px; }
        h1 { font-style: italic; font-weight: 900; font-size: 22px; text-transform: uppercase; margin-bottom: 20px; }
        h1 span { color: #3b82f6; }
        #capa-inicio { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn-activar { padding: 20px 40px; background: #3b82f6; color: white; border: none; border-radius: 50px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 0 30px #3b82f666; text-transform: uppercase; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1c1c1e; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #2c2c2e; cursor: pointer; }
        .stat-card.active { border-color: #3b82f6; background: #1a2638; }
        .stat-card h2 { margin: 0; font-size: 28px; color: #3b82f6; }
        .stat-card p { margin: 5px 0 0 0; font-size: 10px; color: #8e8e93; text-transform: uppercase; }
        .form-container { background: #1c1c1e; padding: 18px; border-radius: 20px; border: 1px solid #2c2c2e; margin-bottom: 20px; }
        .label-text { font-size: 10px; color: #3b82f6; font-weight: bold; margin: 8px 0 4px 5px; display: block; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #2c2c2e; background: #2c2c2e; color: white; box-sizing: border-box; font-size: 15px; }
        .staff-item { background: #000; padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2c2c2e; }
        .btn-mini { padding: 6px 10px; border: none; border-radius: 6px; font-size: 9px; font-weight: bold; cursor: pointer; color: white; }
        .suggestions-list { position: absolute; width: 100%; background: #3b82f6; border-radius: 10px; z-index: 100; max-height: 150px; overflow-y: auto; display: none; }
        .suggestion-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-weight: bold; }
        .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .type-btn { padding: 12px; border-radius: 10px; border: 1px solid #2c2c2e; background: #2c2c2e; color: #8e8e93; font-weight: bold; font-size: 10px; cursor: pointer; }
        .type-btn.active { background: #3b82f6; color: white; }
        .save-btn { width: 100%; padding: 18px; background: #3b82f6; color: white; border: none; border-radius: 15px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; }
        .card-servicio { background: #1c1c1e; padding: 20px; border-radius: 25px; border: 1px solid #2c2c2e; margin-bottom: 15px; position: relative; }
        .chat-btn { position: absolute; right: 15px; top: 15px; width: 45px; height: 45px; background: #007aff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .btn-action { padding: 10px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 10px; cursor: pointer; text-transform: uppercase; }
        .btn-done { background: #22c55e; } .btn-edit { background: #6366f1; } .btn-delete { background: #ef4444; } .btn-contract { background: #004a99; } .btn-review { background: #3b82f6; border: 1px solid #ffffff33; }
        .payroll-container { background: #1c1c1e; padding: 18px; border-radius: 20px; border: 1px solid #22c55e; margin-top: 30px; }
        .payroll-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        .payroll-table th { text-align: left; color: #22c55e; padding: 8px; border-bottom: 1px solid #2c2c2e; }
        .payroll-table td { padding: 10px 8px; border-bottom: 1px solid #2c2c2e; }
        #nico-container { position: fixed; bottom: 20px; right: 20px; width: 100px; height: 100px; z-index: 9999; cursor: pointer; }
        #nico-burbuja { position: absolute; bottom: 110%; right: 0; background: white; color: black; padding: 12px; border-radius: 15px; width: 220px; font-size: 13px; font-weight: 600; display: none; border: 2px solid #3b82f6; }
        #nico-caricatura { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="capa-inicio">
        <h1 style="color:white; font-style:italic;">ELITE <span style="color:#3b82f6;">SYSTEM</span></h1>
        <button class="btn-activar" onclick="controladorNico.activarTodo()">ACTIVAR NICO</button>
        <p style="color:#8e8e93; font-size:10px; margin-top:20px;">Restauración Completa + Botón Reseña</p>
    </div>

    <h1>ELITE <span>ADMIN</span></h1>

    <div id="nico-container" onclick="controladorNico.interactuar()">
        <div id="nico-burbuja">💭 ¡Hola Rodrigo!</div>
        <img id="nico-caricatura" src="nico-assets/reposo.png">
    </div>

    <div class="stats-grid">
        <div class="stat-card active" id="btn-pendientes" onclick="cambiarVista('pendiente')">
            <h2 id="count-pendientes">0</h2>
            <p>Pendientes</p>
        </div>
        <div class="stat-card" id="btn-completados" onclick="cambiarVista('completado')">
            <h2 id="count-completados">0</h2>
            <p>Completados</p>
        </div>
    </div>

    <div class="form-container">
        <span class="label-text">Staff</span>
        <input type="text" id="reg-nombre" placeholder="Nombre">
        <input type="email" id="reg-email" placeholder="Email">
        <input type="number" id="reg-pago" placeholder="Pago/hr">
        <button class="save-btn" onclick="registrarStaff()">GUARDAR STAFF</button>
        <div id="lista-visual-staff"></div>
    </div>

    <div class="form-container">
        <input type="hidden" id="edit-id">
        <span class="label-text">Cliente</span>
        <input type="text" id="cliente" placeholder="Nombre" oninput="filtrarClientes()">
        <div id="suggestions-clientes" class="suggestions-list"></div>
        <input type="text" id="direccion" placeholder="Dirección">
        <input type="tel" id="whatsapp" placeholder="Teléfono">
        <input type="date" id="fecha">
        <input type="time" id="hora">
        <span class="label-text">Tipo</span>
        <div class="type-grid">
            <button class="type-btn active" id="btn-ESTÁNDAR" onclick="selectType('ESTÁNDAR')">ESTÁNDAR</button>
            <button class="type-btn" id="btn-PROFUNDA" onclick="selectType('PROFUNDA')">PROFUNDA</button>
        </div>
        <button class="save-btn" onclick="asignarTrabajo()">ASIGNAR TRABAJO</button>
    </div>

    <div id="historial"></div>

    <div class="payroll-container">
        <span class="label-text" style="color: #22c55e;">Nómina</span>
        <table class="payroll-table">
            <thead><tr><th>Staff</th><th>Horas</th><th>Total</th></tr></thead>
            <tbody id="lista-nomina"></tbody>
        </table>
    </div>

    <script>
        const controladorNico = {
            openaiKey: "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",
            elevenKey: "sk_3bfbc7679725723c15ea43c588edb154a07755bf66174dcc",
            voiceId: "pNInz6obpg8ndclKuzt1",
            audioBase: new Audio(),
            activarTodo: function() {
                document.getElementById('capa-inicio').style.display = 'none';
                this.hablar("¡Rodrigo! Botón de reseña y nómina restaurados. Todo listo para trabajar.");
            },
            obtenerRespuestaIA: async function(msg) {
                try {
                    const res = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${this.openaiKey}` },
                        body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "system", content: "Eres Nico, socio de Elite Cleaners. Sé breve y humano." }, { role: "user", content: msg }] })
                    });
                    const data = await res.json();
                    return data.choices[0].message.content;
                } catch (e) { return "Error de conexión con OpenAI."; }
            },
            hablar: async function(texto) {
                document.getElementById('nico-burbuja').innerText = "💭 " + texto;
                document.getElementById('nico-burbuja').style.display = 'block';
                try {
                    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${this.voiceId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'xi-api-key': this.elevenKey },
                        body: JSON.stringify({ text: texto, model_id: "eleven_multilingual_v2" })
                    });
                    if (res.ok) {
                        const blob = await res.blob();
                        this.audioBase.src = URL.createObjectURL(blob);
                        this.audioBase.play();
                        this.audioBase.onended = () => {
                            document.getElementById('nico-burbuja').style.display = 'none';
                            setTimeout(() => this.activarMicrofono(), 500);
                        };
                    }
                } catch (e) { console.error("ElevenLabs falló"); }
            },
            activarMicrofono: function() {
                const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Recognition) return;
                const mic = new Recognition(); mic.lang = 'es-ES';
                mic.onstart = () => { document.getElementById('nico-container').classList.add('nico-escuchando'); };
                mic.onresult = async (e) => {
                    const frase = e.results[0][0].transcript;
                    const respuesta = await this.obtenerRespuestaIA(frase);
                    this.hablar(respuesta);
                };
                mic.onend = () => { document.getElementById('nico-container').classList.remove('nico-escuchando'); };
                mic.start();
            },
            interactuar: function() { this.activarMicrofono(); }
        };

        const firebaseConfig = { apiKey: "AIzaSyDB4F55StoX8WYYzCm8oSnucc-lrH", authDomain: "elite-cleaners-app.firebaseapp.com", projectId: "elite-cleaners-app", storageBucket: "elite-cleaners-app.appspot.com", messagingSenderId: "826642317319", appId: "1:826642317319:web:cddce7904b590ae" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let todosLosServicios = []; let todosLosEmpleados = []; let todosLosClientes = []; let vistaActual = "pendiente"; let tipoSeleccionado = "ESTÁNDAR";

        db.collection("servicios").onSnapshot(snap => {
            todosLosServicios = []; snap.forEach(doc => todosLosServicios.push({ id: doc.id, ...doc.data() }));
            document.getElementById('count-pendientes').innerText = todosLosServicios.filter(s => s.estado !== 'completado').length;
            document.getElementById('count-completados').innerText = todosLosServicios.filter(s => s.estado === 'completado').length;
            renderHistorial(); generarNomina();
        });

        db.collection("usuarios").where("rol", "==", "empleado").onSnapshot(snap => {
            todosLosEmpleados = []; const lv = document.getElementById('lista-visual-staff'); lv.innerHTML = "";
            snap.forEach(doc => {
                const e = doc.data(); todosLosEmpleados.push({id: doc.id, ...e});
                lv.innerHTML += `<div class="staff-item"><b>${e.nombre}</b> ($${e.pago_hora}/hr) <button class="btn-mini" style="background:red" onclick="borrarStaff('${doc.id}')">X</button></div>`;
            });
            generarNomina();
        });

        db.collection("clientes").onSnapshot(snap => { todosLosClientes = []; snap.forEach(doc => todosLosClientes.push(doc.data())); });

        function renderHistorial() {
            const h = document.getElementById('historial'); h.innerHTML = "";
            todosLosServicios.forEach(s => {
                if((vistaActual === "pendiente" && s.estado !== "completado") || (vistaActual === "completado" && s.estado === "completado")) {
                    h.innerHTML += `
                    <div class="card-servicio">
                        <a class="chat-btn" href="https://wa.me/${s.whatsapp}">💬</a>
                        <h3>${s.cliente}</h3>
                        <p>${s.fecha} - ${s.tipo}</p>
                        <div class="action-buttons">
                            <button class="btn-action btn-done" onclick="marcar('${s.id}', '${s.estado === 'completado' ? 'pendiente' : 'completado'}')">Estado</button>
                            <button class="btn-action btn-review" onclick="window.location.href='https://g.page/r/YOUR_REVIEW_LINK/review'">Reseña</button>
                            <button class="btn-action btn-edit" onclick='editar("${s.id}", ${JSON.stringify(s)})'>Editar</button>
                            <button class="btn-action btn-delete" onclick="borrar('${s.id}')">Borrar</button>
                        </div>
                    </div>`;
                }
            });
        }

        function marcar(id, est) { db.collection("servicios").doc(id).update({ estado: est }); }
        function borrar(id) { if(confirm("¿Borrar?")) db.collection("servicios").doc(id).delete(); }
        function registrarStaff() {
            const n = document.getElementById('reg-nombre').value;
            const e = document.getElementById('reg-email').value;
            const p = document.getElementById('reg-pago').value;
            db.collection("usuarios").add({ nombre: n, email: e, pago_hora: p, rol: "empleado" });
        }
        function borrarStaff(id) { db.collection("usuarios").doc(id).delete(); }
        function selectType(t) { tipoSeleccionado = t; }
        function asignarTrabajo() {
            const data = { cliente: document.getElementById('cliente').value, direccion: document.getElementById('direccion').value, whatsapp: document.getElementById('whatsapp').value, fecha: document.getElementById('fecha').value, hora: document.getElementById('hora').value, tipo: tipoSeleccionado, estado: "pendiente", hora_inicio: "--:--", hora_fin: "--:--" };
            db.collection("servicios").add(data).then(() => location.reload());
        }
        function generarNomina() {
            const tabla = document.getElementById('lista-nomina'); tabla.innerHTML = "";
            todosLosEmpleados.forEach(emp => {
                let horas = 0;
                todosLosServicios.filter(s => s.estado === "completado" && s.empleado_email === emp.email).forEach(s => { horas += 1; });
                if(horas > 0) tabla.innerHTML += `<tr><td>${emp.nombre}</td><td>${horas}h</td><td>$${horas * emp.pago_hora}</td></tr>`;
            });
        }
        function filtrarClientes() {
            const q = document.getElementById('cliente').value.toLowerCase();
            const l = document.getElementById('suggestions-clientes'); l.innerHTML = "";
            const f = todosLosClientes.filter(c => c.nombre.toLowerCase().includes(q));
            f.forEach(c => {
                const d = document.createElement('div'); d.className = 'suggestion-item'; d.innerText = c.nombre;
                d.onclick = () => { document.getElementById('cliente').value = c.nombre; document.getElementById('direccion').value = c.direccion; document.getElementById('whatsapp').value = c.whatsapp; l.style.display = "none"; };
                l.appendChild(d);
            });
            l.style.display = f.length > 0 ? "block" : "none";
        }
    </script>
</body>
</html>
