<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Cleaners - Login</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <style>
        body { background: #000; color: white; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .login-card { width: 90%; max-width: 350px; text-align: center; z-index: 1; }
        h1 { font-style: italic; font-weight: 900; letter-spacing: -1px; margin-bottom: 30px; font-size: 28px; }
        span { color: #3b82f6; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #2c2c2e; background: #1c1c1e; color: white; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #3b82f6; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        #error-msg { color: #ff4d4d; font-size: 13px; margin-top: 15px; font-weight: 500; }

        /* ESTILO DE LA CARICATURA DE NICO */
        .nico-avatar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 120px;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 100;
        }
        .nico-avatar:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>ELITE <span>CLEANERS</span></h1>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="pass" placeholder="Contraseña">
        <button onclick="login()">INGRESAR</button>
        <p id="error-msg"></p>
    </div>

    <img src="https://lh3.googleusercontent.com/d/1_9i_m_5A_UjX6u_X-m8Vp2_Bv-x6U-Yj" 
         class="nico-avatar" 
         onclick="nicoSaluda()" 
         alt="Nde Nico">

    <script>
        // CONFIGURACIÓN DE VOZ DE NICO (ElevenLabs)
        const NICO_API_KEY = "sk_ba07983d6079e159072231b407435733fc33ed16e952e1e8";
        const NICO_VOICE_ID = "pNInz6obpg8ndclKuzt1"; // Voz Antonio

        async function hablarConNico(texto) {
            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${NICO_VOICE_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'xi-api-key': NICO_API_KEY },
                    body: JSON.stringify({
                        text: texto,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.45, similarity_boost: 0.75 }
                    })
                });
                const audioBlob = await response.blob();
                const audio = new Audio(URL.createObjectURL(audioBlob));
                audio.play();
            } catch (e) { console.error("Error voz:", e); }
        }

        function nicoSaluda() {
            hablarConNico("¡Dime, Rodrigo! Estoy listo para trabajar.");
        }

        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDB4F55StoX8WYYzCm8oSnucc-lrH",
            authDomain: "elite-cleaners-app.firebaseapp.com",
            projectId: "elite-cleaners-app",
            storageBucket: "elite-cleaners-app.appspot.com",
            messagingSenderId: "826642317319",
            appId: "1:826642317319:web:cddce7904b590ae"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }

        async function login() {
            const email = document.getElementById('email').value.toLowerCase().trim();
            const pass = document.getElementById('pass').value;
            const errorP = document.getElementById('error-msg');

            errorP.innerText = "Verificando...";

            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(async (userCredential) => {
                    // SI EL LOGIN ES EXITOSO, NICO TE SALUDA ANTES DE ENTRAR
                    await hablarConNico("¡Bienvenido, Rodrigo! Entrando al sistema.");
                    
                    setTimeout(() => {
                        if(userCredential.user.email === "admin@elite.com") {
                            window.location.href = "admin.html";
                        } else {
                            window.location.href = "empleado.html";
                        }
                    }, 2000); // Esperamos 2 segundos para que se escuche el saludo
                })
                .catch((error) => {
                    errorP.innerText = "Correo o contraseña incorrectos.";
                });
        }
    </script>
</body>
</html>
