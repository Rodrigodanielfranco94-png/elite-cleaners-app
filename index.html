<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Elite Cleaners - Login</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <style>
        body {
            background:#000;
            color:white;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
        }
        .login-card { width:90%; max-width:350px; text-align:center; }
        h1 { font-style:italic; font-weight:900; letter-spacing:-1px; margin-bottom:30px; font-size:28px; }
        h1 span { color:#3b82f6; }
        input {
            width:100%;
            padding:15px;
            margin:10px 0;
            border-radius:12px;
            border:1px solid #2c2c2e;
            background:#1c1c1e;
            color:white;
            box-sizing:border-box;
            font-size:16px;
        }
        button {
            width:100%;
            padding:15px;
            background:#3b82f6;
            color:white;
            border:none;
            border-radius:12px;
            font-weight:bold;
            cursor:pointer;
            margin-top:10px;
            font-size:16px;
        }
        button:disabled { opacity:.65; cursor:wait; }
        #error-msg { color:#ff6b6b; font-size:13px; margin-top:15px; font-weight:500; min-height:18px; }
    </style>
</head>
<body>
    <form class="login-card" id="login-form">
        <h1>ELITE <span>CLEANERS</span></h1>
        <input type="email" id="email" placeholder="Correo electrónico" autocomplete="username" required>
        <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password" required>
        <button id="login-btn" type="submit">INGRESAR</button>
        <p id="error-msg" role="alert"></p>
    </form>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDB4F55StoX8WYYzCm8oSnucclrHyvjpLA",
            authDomain: "elite-cleaners-app.firebaseapp.com",
            projectId: "elite-cleaners-app",
            storageBucket: "elite-cleaners-app.firebasestorage.app",
            messagingSenderId: "826642317319",
            appId: "1:826642317319:web:cddce7904b590aea682aa2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        const form = document.getElementById("login-form");
        const errorP = document.getElementById("error-msg");
        const button = document.getElementById("login-btn");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.toLowerCase().trim();
            const pass = document.getElementById("pass").value;

            errorP.textContent = "Verificando...";
            button.disabled = true;

            try {
                const credential = await firebase.auth().signInWithEmailAndPassword(email, pass);
                const destination = credential.user.email === "admin@elite.com"
                    ? "admin.html"
                    : "staff_v3.html";

                window.location.href = destination;
            } catch (error) {
                console.error("Login error:", error);
                errorP.textContent = "Correo o contraseña incorrectos.";
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
